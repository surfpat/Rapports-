<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202226">
<title>Firewise — Equipment Care</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%23c1272d'/><path d='M12 3.2c2.6 3.1 4.4 5.4 4.4 8A5 5 0 0 1 7.6 12c0-1.2.35-2.3 1.05-3.4.45 1.05 1.15 1.75 2.1 2.1-.3-2.9.4-5.2 3.25-7.5z' fill='white'/></svg>">
<link rel="stylesheet" href="style.css">
<script>
// Capture précoce des erreurs de chargement de scripts externes (avant les <script src>)
window.__fwFailed = [];
window.addEventListener('error', function(e){
  var t = e.target || e.srcElement;
  if(t && t.nodeName === 'SCRIPT' && t.src){
    var n = t.src.split('/').pop().split('?')[0];
    if(window.__fwFailed.indexOf(n) < 0) window.__fwFailed.push(n);
  }
}, true);
</script>
  <link rel="manifest" href="manifest.json">
</head>
<body>

<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <span class="brand-mark"><svg viewBox="0 0 24 24"><path d="M12 3.2c2.6 3.1 4.4 5.4 4.4 8A5 5 0 0 1 7.6 12c0-1.2.35-2.3 1.05-3.4.45 1.05 1.15 1.75 2.1 2.1-.3-2.9.4-5.2 3.25-7.5z"/></svg></span>
      <div class="brand-txt"><b>FIREWISE</b><span>Equipment Care</span></div>
    </div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <b>v1.1</b> — données stockées<br>localement sur cet appareil
    </div>
  </aside>
  <main id="content">
    <div id="view">
      <div class="empty" id="bootMsg" style="padding:60px 20px">
        <b>Chargement…</b>
        <p>Si ce message persiste, JavaScript est désactivé ou un script n'a pas pu se charger.</p>
      </div>
    </div>
  </main>
</div>

<noscript>
  <div style="padding:40px;text-align:center;font-family:system-ui,sans-serif">
    <h2>JavaScript est requis</h2>
    <p>Cette application nécessite JavaScript pour fonctionner. Activez-le dans votre navigateur, puis rechargez la page.</p>
  </div>
</noscript>

<div id="overlay"><div class="modal" id="modalBox"></div></div>
<div id="toasts"></div>
<div id="printArea"></div>

<!-- Scripts applicatifs (locaux, chargement immédiat, non bloqués par le CDN) -->
<script src="core.js"></script>
<script src="views.js"></script>
<script src="registry.js"></script>
<script src="forms.js"></script>
<script src="reports.js"></script>
<script src="reportform.js"></script>
<script src="reportrows.js"></script>
<script src="exports.js"></script>
<script src="sync.js"></script>
<script src="settings.js"></script>

<!-- Diagnostic de démarrage : si render() n'a pas remplacé bootMsg, un script externe a échoué. -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  if(document.getElementById('bootMsg')){
    var failed = window.__fwFailed || [];
    var v = document.getElementById('view');
    var list = failed.length
      ? '<p style="margin:12px 0">Fichier(s) en échec : <code style="background:#f2f1ef;padding:2px 6px;border-radius:4px">' + failed.join(', ') + '</code></p>'
      : '<p style="margin:12px 0">Aucun fichier .js n\'a pu être chargé — ouvrez index.html depuis son dossier complet.</p>';
    v.innerHTML = '<div style="padding:40px 24px;max-width:600px;margin:0 auto;font-family:system-ui,sans-serif">'
      + '<h2 style="color:#c1272d;margin:0 0 8px">L\'application n\'a pas pu démarrer</h2>'
      + '<p style="color:#666;margin:0 0 4px">Un ou plusieurs scripts JavaScript n\'ont pas pu se charger.</p>'
      + list
      + '<p style="line-height:1.7;margin:14px 0 4px"><b>Vérifiez que :</b></p>'
      + '<ul style="line-height:1.9;padding-left:20px;margin:4px 0">'
      + '<li>Vous ouvrez <code>index.html</code> depuis son dossier, avec les 9 fichiers <code>.js</code> et <code>style.css</code>.</li>'
      + '<li>Aucun fichier n\'a été oublié au téléchargement ou à la copie.</li>'
      + '<li>Votre navigateur autorise les scripts locaux (Chrome, Firefox, Edge).</li>'
      + '</ul>'
      + '<p style="margin-top:14px;line-height:1.6;color:#666">Détail des erreurs dans la console : <b>F12</b> → onglet « Console ».</p>'
      + '</div>';
  }
});
</script>

<!-- Bibliothèques externes via CDN, chargées en arrière-plan (defer = non bloquant).
     L'application fonctionne sans elles ; seules les signatures et les exports
     PDF/Word nécessitent une connexion internet au premier usage. -->
<script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" defer></script>
</body>
</html>
