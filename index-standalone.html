<script data-src="reportform.js">
/* =====================================================================
   FIREWISE EQUIPMENT CARE — reportform.js  (v2 — formulaire adaptatif)
   Formulaire de rapport structuré en accordéon, adaptatif selon :
   - le type de rapport (profil → sections affichées)
   - le type de matériel concerné (section batteries conditionnelle)
   Les fonctions collectTests/collectBatteries (reportrows.js) sont
   réutilisées à l'identique — compatibilité préservée avec le stockage.
===================================================================== */

/* ---------- 11. Formulaire de rapport ---------- */
let pads = {}; // SignaturePad actifs de la modale courante

function nextReportNo(){
  const year = new Date().getFullYear();
  let max = 0;
  state.reports.forEach(r => {
    const m = /^RPT-(\d{4})-(\d+)$/.exec(r.no || '');
    if(m && +m[1] === year) max = Math.max(max, +m[2]);
  });
  return `RPT-${year}-${String(max + 1).padStart(4, '0')}`;
}

function eqDesc(e){
  return `${typeLabel(e.type)} ${e.brand||''} ${e.model||''}`.trim() + (e.serial ? ` (NS ${e.serial})` : '');
}

/* Détermine si la section « batteries » doit s'afficher :
   - en mode base : si le matériel coché du périmètre contient un type
     de BATTERY_EQ_TYPES (centrales, extinction, etc.)
   - en mode libre : toujours proposée (matériel décrit en texte) */
function hasBatteryEquipment(r){
  if(r.linkMode === 'free') return true;
  const ids = Array.isArray(r.equipmentIds) ? r.equipmentIds : [];
  return state.equipment.some(e => ids.includes(e.id) && BATTERY_EQ_TYPES.includes(e.type));
}

/* ---------- Rendu d'une section d'accordéon ---------- */
function accSection(key, bodyHTML, opts = {}){
  const meta = REPORT_SECTIONS[key] || { title:key, ico:'•' };
  const open = opts.open ? ' open' : '';
  const disabled = opts.disabled ? ' disabled' : '';
  const sub = meta.sub ? `<span class="acc-sub"> — ${meta.sub}</span>` : '';
  return `
    <div class="acc-sec${open}${disabled}" data-sec="${key}">
      <button type="button" class="acc-head">
        <span class="acc-ico">${meta.ico||'•'}</span>
        <span class="acc-title">${meta.title}${sub}</span>
        <svg class="acc-chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l4 4-4 4"/></svg>
      </button>
      <div class="acc-body">${bodyHTML}</div>
    </div>`;
}

/* ---------- Câble l'accordéon (ouverture/fermeture au clic) ---------- */
function wireAccordion(){
  modalBox.querySelectorAll('.acc-sec:not(.disabled) .acc-head').forEach(head => {
    head.onclick = () => {
      const sec = head.closest('.acc-sec');
      // Si la section contient du matériel dynamique (équipement, batteries),
      // on ne peut pas juste toggler le display — on bascule la classe.
      sec.classList.toggle('open');
    };
  });
}

function openReportForm(reportId){
  pads = {};
  // reportId peut être : un id (string) | un objet draft (préfixé _draft) | null/undefined
  let r;
  if(reportId && typeof reportId === 'object' && reportId._draft){
    r = reportId; // brouillon en mémoire (changement de type sur nouveau rapport)
  } else {
    r = state.reports.find(x => x.id === reportId) || {};
  }
  const mode = r.linkMode || 'base';
  const reportType = r.type || 'maintenance';
  const profile = REPORT_PROFILES[reportType] || REPORT_PROFILES.maintenance;
  const piecesHTML = (r.pieces && r.pieces.length ? r.pieces : [{}]).map(p => pieceRow(p)).join('');

  // Détermine les sections réellement rendues (batteries conditionnelle au matériel)
  const showBatteries = hasBatteryEquipment(r);
  const sections = profile.sections.filter(s => s !== 'batteries' || showBatteries);

  // Construit le HTML de chaque section selon sa clé
  const sectionHTML = (key) => {
    switch(key){
      case 'info': return `
        <div class="fgrid">
          <div class="field"><label>Type de rapport *</label>
            <select id="f_type">${Object.entries(REPORT_TYPES).map(([k,l]) => `<option value="${k}" ${k===r.type?'selected':''}>${l}</option>`).join('')}</select></div>
          <div class="field"><label>Date d’intervention *</label><input type="date" id="f_date" value="${esc(r.date||todayISO())}"></div>
          <div class="field full"><label>Technicien *</label><input id="f_tech" value="${esc(r.tech||'')}" placeholder="Nom et initiales"></div>
        </div>`;

      case 'liaison': return `
        <div style="display:flex;gap:18px;margin-bottom:14px;font-size:13px;flex-wrap:wrap">
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="f_linkmode" value="base" ${mode==='base'?'checked':''}> Lier au registre</label>
          <label style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="radio" name="f_linkmode" value="free" ${mode==='free'?'checked':''}> Saisie libre (hors registre)</label>
        </div>
        <div id="lkBase" style="${mode==='free'?'display:none':''}">
          <div class="fgrid">
            <div class="field"><label>Site</label><select id="f_site"><option value="">—</option>${state.sites.map(s => `<option value="${s.id}" ${s.id===r.siteId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
            <div class="field"><label>Bâtiment</label><select id="f_bld"><option value="">— tout le site —</option></select></div>
          </div>
          ${!state.sites.length ? '<p class="hint">Le registre est vide : créez un site, ou choisissez « saisie libre ».</p>' : ''}
        </div>
        <div id="lkFree" style="${mode==='base'?'display:none':''}">
          <div class="fgrid">
            <div class="field"><label>Site (texte libre)</label><input id="f_freeSite" value="${esc(r.siteName||'')}"></div>
            <div class="field"><label>Bâtiment / zone</label><input id="f_freeBld" value="${esc(r.buildingName||'')}"></div>
            <div class="field full"><label>Matériel décrit</label><input id="f_freeEq" value="${esc(r.equipmentDesc||'')}" placeholder="Ex. : Centrale de détection, local CMCF"></div>
          </div>
        </div>`;

      case 'equipement': return `
        <div id="lkBaseEquip" style="${mode==='free'?'display:none':''}">
          <div class="field"><label>Matériel concerné & tests</label>
            <div id="f_eqBox" style="border:1px solid var(--line-2);border-radius:6px;max-height:340px;overflow-y:auto;background:#fff">
              <div class="hint" style="padding:10px">Choisissez un site et un bâtiment pour lister son matériel.</div>
            </div>
            <div style="display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap">
              <button type="button" class="mini" id="f_eqAll">Tout sélectionner</button>
              <button type="button" class="mini" id="f_eqNone">Tout désélectionner</button>
              <button type="button" class="mini" id="f_eqAddFree">+ Hors registre</button>
              <span class="hint" id="f_eqCount" style="margin-left:auto"></span>
            </div>
          </div>
        </div>
        <div id="lkFreeEquip" style="${mode==='base'?'display:none':''}">
          <div class="field"><label>Matériel concerné (saisie libre)</label>
            <div id="f_eqBox" style="border:1px solid var(--line-2);border-radius:6px;min-height:60px;background:#fff"></div>
            <div style="margin-top:8px"><button type="button" class="mini" id="f_eqAddFree">+ Ajouter une ligne</button></div>
          </div>
        </div>`;

      case 'controle': return `
        <div class="field"><label>Contrôles & essais réalisés *</label>
          <textarea id="f_obs" placeholder="Tests de boucles, sensibilités, essais fonctionnels, alimentation secourue, reports au CMSI…">${esc(r.obs||'')}</textarea></div>`;

      case 'diagnostic': return `
        <div class="field"><label>Défaut signalé / cause</label>
          <textarea id="f_diag" placeholder="Défaut signalé, circonstances, hypothèses de cause…">${esc(r.diagnostic||'')}</textarea></div>
        <div class="field"><label>Analyse & origine</label>
          <textarea id="f_diag2" placeholder="Analyse technique, mesure ou test ayant permis d’identifier l’origine…">${esc(r.diag2||'')}</textarea></div>`;

      case 'actions': return `
        <div class="field"><label>Actions réalisées</label>
          <textarea id="f_act" placeholder="Intervention, réglages, remise en service, essais après intervention…">${esc(r.actions||'')}</textarea></div>`;

      case 'pieces': return `
        <div class="field"><label>Pièces remplacées</label>
          <div id="piecesBox">${piecesHTML}</div>
          <div style="margin-top:6px"><button type="button" class="mini" id="addPiece">+ Ajouter une pièce</button></div>
        </div>`;

      case 'reception': return `
        <div class="field"><label>État à réception</label>
          <textarea id="f_reception" placeholder="Conformité de l’installation reçue, documents techniques remis par l’installateur…">${esc(r.reception||'')}</textarea></div>
        <div class="field"><label>Vérifications initiales</label>
          <textarea id="f_verifInit" placeholder="Vérifications mécaniques, câblage, alimentations, protection…">${esc(r.verifInit||'')}</textarea></div>`;

      case 'reglages': return `
        <div class="field"><label>Réglages & paramétrage</label>
          <textarea id="f_reglages" placeholder="Configuration saisie, adresses boucles, seuils, temporisations, reports…">${esc(r.reglages||'')}</textarea></div>`;

      case 'formation': return `
        <div class="field"><label>Formation remise</label>
          <textarea id="f_formation" placeholder="Formation utilisateur, consignes d’exploitation, documents remis (carnet, schémas, procédures)…">${esc(r.formation||'')}</textarea></div>`;

      case 'rondes': return `
        <div class="field"><label>Rondes & contrôles visuels de la journée</label>
          <textarea id="f_obs" placeholder="États observés, points contrôlés, événements de la journée…">${esc(r.obs||'')}</textarea></div>`;

      case 'obs': return `
        <div class="field"><label>Observations / constat *</label>
          <textarea id="f_obs" placeholder="Observations générales, constat technique…">${esc(r.obs||'')}</textarea></div>`;

      case 'anomalies': return `
        <div class="field"><label>Anomalies constatées</label>
          <textarea id="f_ano" placeholder="Défauts, non-conformités, points nécessitant une action…">${esc(r.anomalies||'')}</textarea></div>`;

      case 'reco': return `
        <div class="fgrid">
          <div class="field"><label>Recommandations</label><textarea id="f_reco" placeholder="Recommandations, actions préventives…">${esc(r.reco||'')}</textarea></div>
          <div class="field"><label>Prochaine visite</label><input type="date" id="f_next" value="${esc(r.nextVisit||'')}"></div>
        </div>`;

      case 'batteries': return batteriesFieldsetHTML(r);

      case 'signatures': return `
        <div class="fgrid">
          <div class="field"><label>Technicien</label>
            <div class="sigBox"><canvas id="sigTech" style="width:100%;height:140px;border:1px dashed var(--line-2);border-radius:6px;background:#fff;touch-action:none"></canvas>
            <div style="margin-top:6px"><button type="button" class="mini" id="clearTech">Effacer</button></div></div></div>
          <div class="field"><label>Client / représentant site</label>
            <div class="sigBox"><canvas id="sigClient" style="width:100%;height:140px;border:1px dashed var(--line-2);border-radius:6px;background:#fff;touch-action:none"></canvas>
            <div style="margin-top:6px"><button type="button" class="mini" id="clearClient">Effacer</button></div></div></div>
        </div>`;
      default: return '';
    }
  };

  // Construit l'accordéon : 1re section (info) ouverte, les autres repliées
  const accordionHTML = sections.map((key, i) => {
    return accSection(key, sectionHTML(key), { open: i === 0 });
  }).join('');

  // Titre du modal : profil du type de rapport
  const modalTitle = r.id ? `Modifier le rapport ${r.no}` : `Nouveau rapport — ${nextReportNo()}`;
  const modalSub = profile.label + ' · ' + profile.sub;

  openModal(`${modalTitle}|||${modalSub}`, `
    <p class="hint" style="margin-bottom:14px;padding:11px 14px;background:var(--bg-2);border-radius:var(--radius);border-left:3px solid var(--accent)">${esc(profile.intro)}</p>
    <div class="accordion">${accordionHTML}</div>
  `, true);

  // Le titre du modal contient "titre|||sous-titre" → on sépare et on habille
  const modalH = modalBox.querySelector('.modal-h h3');
  if(modalH){
    const [main, sub] = modalH.textContent.split('|||');
    modalH.innerHTML = `${esc(main)}<div class="modal-h-sub">${esc(sub||'')}</div>`;
  }

  wireAccordion();

  // --- signatures ---
  function initPad(canvasId, existingData){
    const cv = document.getElementById(canvasId);
    if(!cv) return null;
    if(typeof SignaturePad === 'undefined'){
      const ctx = cv.getContext('2d');
      ctx.fillStyle = '#8f9296'; ctx.font = '13px system-ui, sans-serif';
      ctx.fillText('Bibliothèque de signature non chargée', 12, 30);
      ctx.fillText('(connexion internet requise, rechargez la page)', 12, 50);
      return null;
    }
    const rect = cv.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(rect.width * dpr); cv.height = Math.round(rect.height * dpr);
    const pad = new SignaturePad(cv, { penColor:'#1e2022', backgroundColor:'rgb(255,255,255)' });
    if(existingData) pad.fromDataURL(existingData, { ratio:1 });
    return pad;
  }
  // Les signatures ne sont initialisées que si la section est rendue
  if(sections.includes('signatures')){
    setTimeout(() => {
      pads.tech = initPad('sigTech', r.sigTech);
      pads.client = initPad('sigClient', r.sigClient);
    }, 60);
    modalBox.querySelector('#clearTech').onclick = () => pads.tech && pads.tech.clear();
    modalBox.querySelector('#clearClient').onclick = () => pads.client && pads.client.clear();
  }

  // --- liaison registre / saisie libre ---
  const linkRadios = modalBox.querySelectorAll('input[name="f_linkmode"]');
  function syncLink(){
    const free = modalBox.querySelector('input[name="f_linkmode"]:checked').value === 'free';
    const lkBase = modalBox.querySelector('#lkBase');
    const lkFree = modalBox.querySelector('#lkFree');
    const lkBaseEquip = modalBox.querySelector('#lkBaseEquip');
    const lkFreeEquip = modalBox.querySelector('#lkFreeEquip');
    if(lkBase) lkBase.style.display = free ? 'none' : '';
    if(lkFree) lkFree.style.display = free ? '' : 'none';
    if(lkBaseEquip) lkBaseEquip.style.display = free ? 'none' : '';
    if(lkFreeEquip) lkFreeEquip.style.display = free ? '' : 'none';
    // En mode libre : on charge les lignes hors registre sauvegardées
    if(free){
      const savedFree = (r.tests || []).filter(t => !t.eqId);
      if(savedFree.length){
        const box = modalBox.querySelector('#f_eqBox');
        box.innerHTML = savedFree.map(t => eqTestRowHTML(null, true, t)).join('');
        wireEqRows();
      }
    }
  }
  if(linkRadios.length) linkRadios.forEach(rd => rd.onchange = syncLink);

  // --- cascades + check-list « Matériel concerné » (mode base uniquement) ---
  const siteSel = modalBox.querySelector('#f_site'), bldSel = modalBox.querySelector('#f_bld');

  function eqTestRowHTML(e, checked, test){
    const t = test || {};
    const isFree = !e;
    const label = e ? eqDesc(e) : (t.label || '');
    const sub = e ? `${esc(e.loc||'Localisation non renseignée')}${e.serial ? ' · NS ' + esc(e.serial) : ''}` : '';
    const resVal = t.res || 'nonteste';
    return `
      <div class="eqRow" data-eqid="${e ? e.id : ''}" style="display:grid;grid-template-columns:24px 1fr 130px;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:flex-start;font-size:13px">
        ${isFree
          ? `<button type="button" class="mini del eqDel" style="margin-top:0;padding:0;width:22px;height:22px;line-height:1">×</button>`
          : `<input type="checkbox" class="f_eqChk" value="${e.id}" ${checked ? 'checked' : ''} style="margin-top:3px">`}
        <div>
          ${isFree
            ? `<input class="t_free" placeholder="Désignation du matériel (saisie libre)" value="${esc(label)}" style="width:100%;font-weight:600;border:none;background:transparent;padding:0;font-size:13px">`
            : `<b>${esc(label)}</b><br><span style="color:var(--ink-3);font-size:12px">${sub}</span>`}
          <input class="t_note" placeholder="Test réalisé / observation" value="${esc(t.note||'')}" style="margin-top:4px;width:100%">
        </div>
        <select class="t_res">
          <option value="nonteste" ${resVal==='nonteste'?'selected':''}>Non testé</option>
          ${Object.entries(TEST_RESULTS).map(([v,l]) => `<option value="${v}" ${v===resVal?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>`;
  }
  function updateEqCount(){
    const all = modalBox.querySelectorAll('#f_eqBox .f_eqChk');
    const n = modalBox.querySelectorAll('#f_eqBox .f_eqChk:checked').length;
    const countEl = modalBox.querySelector('#f_eqCount');
    if(countEl) countEl.textContent = all.length ? `${n}/${all.length} sélectionné(s)` : '';
    syncBatteriesSection();
  }
  // Recalcule dynamiquement la visibilité de la section batteries selon le
  // matériel coché : insère la section si du matériel à batterie est coché,
  // la retire sinon. Préserve les saisies de batteries déjà effectuées.
  function syncBatteriesSection(){
    const profile = REPORT_PROFILES[modalBox.querySelector('#f_type')?.value || 'maintenance'] || REPORT_PROFILES.maintenance;
    if(!profile.sections.includes('batteries')) return; // profil sans section batteries (journalier)
    const checkedIds = [...modalBox.querySelectorAll('#f_eqBox .f_eqChk:checked')].map(c => c.value);
    const hasBat = checkedIds.some(id => {
      const e = state.equipment.find(x => x.id === id);
      return e && BATTERY_EQ_TYPES.includes(e.type);
    });
    // En mode libre, on considère qu'il peut y avoir batterie
    const linkMode = modalBox.querySelector('input[name="f_linkmode"]:checked')?.value || 'base';
    const show = hasBat || linkMode === 'free';
    const existing = modalBox.querySelector('.acc-sec[data-sec="batteries"]');
    if(show && !existing){
      // Préserver les batteries déjà saisies
      const savedBatteries = (r.batteries && r.batteries.length) ? r.batteries : [{}];
      const fakeR = Object.assign({}, r, { batteries: savedBatteries });
      // Insérer la section batteries AVANT la section 'actions' ou à défaut avant 'reco'
      const order = profile.sections;
      const batIdx = order.indexOf('batteries');
      const afterKey = order.slice(batIdx + 1).find(k => modalBox.querySelector(`.acc-sec[data-sec="${k}"]`));
      const refNode = afterKey ? modalBox.querySelector(`.acc-sec[data-sec="${afterKey}"]`) : null;
      const html = accSection('batteries', batteriesFieldsetHTML(fakeR), { open: false });
      if(refNode){
        refNode.insertAdjacentHTML('beforebegin', html);
      } else {
        const acc = modalBox.querySelector('.accordion');
        if(acc) acc.insertAdjacentHTML('beforeend', html);
      }
      // Câbler la section batteries fraîchement insérée
      const newSec = modalBox.querySelector('.acc-sec[data-sec="batteries"]');
      if(newSec){
        const head = newSec.querySelector('.acc-head');
        if(head) head.onclick = () => newSec.classList.toggle('open');
        newSec.querySelectorAll('.batRow').forEach(wireBatteryRow);
        const addBtn = newSec.querySelector('#addBattery');
        if(addBtn) addBtn.onclick = () => {
          const box = newSec.querySelector('#batteriesBox');
          if(box){ box.insertAdjacentHTML('beforeend', batteryRowHTML()); wireBatteryRow(box.lastElementChild); }
        };
      }
    } else if(!show && existing){
      // Sauvegarder les batteries saisies avant de retirer la section
      if(typeof collectBatteries === 'function'){
        r.batteries = collectBatteries();
      }
      existing.remove();
    }
  }
  function captureEqState(){
    const cur = { checked:new Set(), tests:{}, free:[] };
    modalBox.querySelectorAll('#f_eqBox .eqRow').forEach(row => {
      const eqId = row.dataset.eqid;
      const chk = row.querySelector('.f_eqChk');
      const res = row.querySelector('.t_res').value;
      const note = row.querySelector('.t_note').value.trim();
      if(eqId){
        if(chk && chk.checked) cur.checked.add(eqId);
        cur.tests[eqId] = { res, note };
      } else {
        cur.free.push({ label: row.querySelector('.t_free').value.trim(), res, note });
      }
    });
    return cur;
  }
  function wireEqRows(){
    modalBox.querySelectorAll('#f_eqBox .eqRow').forEach(row => {
      const chk = row.querySelector('.f_eqChk');
      const res = row.querySelector('.t_res');
      const note = row.querySelector('.t_note');
      const del = row.querySelector('.eqDel');
      const syncRow = () => {
        if(chk){
          const on = chk.checked;
          row.style.opacity = on ? '1' : '0.45';
          if(res) res.disabled = !on;
          if(note) note.disabled = !on;
        }
      };
      if(chk) chk.onchange = () => { syncRow(); updateEqCount(); };
      if(del) del.onclick = () => { row.remove(); updateEqCount(); };
      syncRow();
    });
  }
  function fillEq(){
    const sid = siteSel ? siteSel.value : '', bid = bldSel ? bldSel.value : '';
    const es = state.equipment.filter(e => e.siteId === sid && (!bid || e.buildingId === bid));
    const box = modalBox.querySelector('#f_eqBox');
    if(!box) return;
    const hasRows = !!box.querySelector('.eqRow');
    const cur = hasRows ? captureEqState() : null;
    const savedIds = r.id && Array.isArray(r.equipmentIds) ? new Set(r.equipmentIds) : null;
    const savedTests = {};
    if(r.tests) r.tests.forEach(t => { if(t.eqId) savedTests[t.eqId] = t; });
    const savedFree = r.tests ? r.tests.filter(t => !t.eqId) : [];

    let html = '';
    if(es.length){
      html += es.map(e => {
        let checked, test;
        if(cur && cur.tests[e.id]){
          checked = cur.checked.has(e.id);
          test = cur.tests[e.id];
        } else if(savedIds){
          checked = savedIds.has(e.id);
          test = savedTests[e.id] || { res:'nonteste' };
        } else {
          checked = true;
          test = { res:'nonteste' };
        }
        return eqTestRowHTML(e, checked, test);
      }).join('');
    }
    const freeRows = cur ? cur.free : savedFree;
    freeRows.forEach(t => { html += eqTestRowHTML(null, true, t); });

    if(!html){
      html = '<div class="hint" style="padding:10px">Aucun matériel dans ce périmètre : ajoutez-en au registre, ou cliquez « + Hors registre ».</div>';
    }
    box.innerHTML = html;
    wireEqRows();
    updateEqCount();
  }
  function fillBld(keep){
    if(!bldSel) return;
    const bs = state.buildings.filter(b => b.siteId === siteSel.value);
    bldSel.innerHTML = '<option value="">— tout le site —</option>'
      + bs.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('');
    if(keep && bs.find(b => b.id === keep)) bldSel.value = keep;
    fillEq();
  }
  if(siteSel) siteSel.onchange = () => fillBld();
  if(bldSel) bldSel.onchange = () => fillEq();
  function setAllEq(checked){
    modalBox.querySelectorAll('#f_eqBox .f_eqChk').forEach(c => {
      c.checked = checked;
      const row = c.closest('.eqRow');
      row.style.opacity = checked ? '1' : '0.45';
      row.querySelector('.t_res').disabled = !checked;
      row.querySelector('.t_note').disabled = !checked;
    });
    updateEqCount();
  }
  const eqAll = modalBox.querySelector('#f_eqAll');
  const eqNone = modalBox.querySelector('#f_eqNone');
  const eqAddFree = modalBox.querySelector('#f_eqAddFree');
  if(eqAll) eqAll.onclick = () => setAllEq(true);
  if(eqNone) eqNone.onclick = () => setAllEq(false);
  if(eqAddFree) eqAddFree.onclick = () => {
    const box = modalBox.querySelector('#f_eqBox');
    const hint = box.querySelector('.hint');
    if(hint) hint.remove();
    box.insertAdjacentHTML('beforeend', eqTestRowHTML(null, true, { res:'nonteste' }));
    wireEqRows();
  };
  if(mode === 'base' && siteSel){
    fillBld(r.buildingId);
  } else if(mode === 'free'){
    const savedFree = (r.tests || []).filter(t => !t.eqId);
    if(savedFree.length){
      const box = modalBox.querySelector('#f_eqBox');
      if(box){
        box.innerHTML = savedFree.map(t => eqTestRowHTML(null, true, t)).join('');
        wireEqRows();
      }
    }
  }

  // --- pièces ---
  function pieceRow(p = {}){
    return `<div class="pieceRow" style="display:grid;grid-template-columns:1fr 130px 56px 30px;gap:8px;margin-bottom:8px">
      <input class="p_d" placeholder="Désignation" value="${esc(p.d||'')}">
      <input class="p_r" placeholder="Référence" value="${esc(p.r||'')}">
      <input class="p_q" placeholder="Qté" value="${esc(p.q||'')}">
      <button type="button" class="mini del p_del" title="Retirer">×</button></div>`;
  }
  const addPieceBtn = modalBox.querySelector('#addPiece');
  if(addPieceBtn) addPieceBtn.onclick = () => {
    const box = modalBox.querySelector('#piecesBox');
    if(box){
      box.insertAdjacentHTML('beforeend', pieceRow());
      wirePieceDels();
    }
  };
  function wirePieceDels(){
    modalBox.querySelectorAll('.p_del').forEach(b => b.onclick = () => b.closest('.pieceRow').remove());
  }
  wirePieceDels();

  // --- matériel testé + mesures batteries (reportrows.js) ---
  if(typeof wireReportRows === 'function') wireReportRows();

  // --- Changement de type de rapport : recharger le formulaire avec le bon profil ---
  const typeSel = modalBox.querySelector('#f_type');
  if(typeSel){
    typeSel.onchange = () => {
      // Préserver les saisies courantes dans un objet draft en mémoire
      const cur = collectCurrent();
      cur.type = typeSel.value;
      cur._draft = true;            // marqueur : brouillon non sauvegardé
      if(r.id) cur.id = r.id;       // conserver l'id si on édite un rapport existant
      // Préserver le matériel testé et les batteries saisies
      if(typeof collectTests === 'function') cur.tests = collectTests();
      if(typeof collectBatteries === 'function') cur.batteries = collectBatteries();
      cur.pieces = collectPieces();
      if(pads.tech && !pads.tech.isEmpty()) cur.sigTech = pads.tech.toDataURL('image/png');
      else if(r.sigTech) cur.sigTech = r.sigTech;
      if(pads.client && !pads.client.isEmpty()) cur.sigClient = pads.client.toDataURL('image/png');
      else if(r.sigClient) cur.sigClient = r.sigClient;
      // Préserver la liaison registre courante (valeurs des selects)
      const linkChecked = modalBox.querySelector('input[name="f_linkmode"]:checked');
      cur.linkMode = linkChecked ? linkChecked.value : (r.linkMode || 'base');
      if(cur.linkMode === 'base'){
        const ssEl = modalBox.querySelector('#f_site');
        const bsEl = modalBox.querySelector('#f_bld');
        if(ssEl && ssEl.value){
          cur.siteId = ssEl.value;
          cur.buildingId = bsEl ? (bsEl.value || null) : null;
          const s = state.sites.find(x => x.id === ssEl.value);
          const b = state.buildings.find(x => x.id === (bsEl ? bsEl.value : ''));
          if(s) cur.siteName = s.name;
          if(b) cur.buildingName = b.name;
          const checkedEqs = [...modalBox.querySelectorAll('#f_eqBox .f_eqChk:checked')]
            .map(c => state.equipment.find(x => x.id === c.value)).filter(Boolean);
          cur.equipmentIds = checkedEqs.map(e => e.id);
          cur.equipmentId = checkedEqs[0] ? checkedEqs[0].id : null;
          cur.equipmentDesc = checkedEqs.length === 1 ? eqDesc(checkedEqs[0])
                            : checkedEqs.length ? `${checkedEqs.length} matériel(s) concerné(s)` : '';
          cur.equipmentList = checkedEqs.map(e => eqFullLabel(e));
        }
      } else {
        // Mode libre : préserver les champs texte
        const fss = modalBox.querySelector('#f_freeSite');
        const fbs = modalBox.querySelector('#f_freeBld');
        const feq = modalBox.querySelector('#f_freeEq');
        if(fss) cur.siteName = fss.value.trim();
        if(fbs) cur.buildingName = fbs.value.trim();
        if(feq) cur.equipmentDesc = feq.value.trim();
      }
      // Re-render complet du formulaire avec le nouveau profil
      closeModal();
      openReportForm(cur);
    };
  }
  function collectPieces(){
    const out = [];
    modalBox.querySelectorAll('.pieceRow').forEach(row => {
      const d = row.querySelector('.p_d').value.trim();
      if(d) out.push({ d, r:row.querySelector('.p_r').value.trim(), q:row.querySelector('.p_q').value.trim() });
    });
    return out;
  }
  function collectCurrent(){
    const g = id => { const el = modalBox.querySelector('#'+id); return el ? el.value.trim() : ''; };
    const out = {
      type: g('f_type'), date: g('f_date'), tech: g('f_tech'),
      obs: g('f_obs'), anomalies: g('f_ano'), actions: g('f_act'),
      reco: g('f_reco'), nextVisit: modalBox.querySelector('#f_next') ? modalBox.querySelector('#f_next').value : '',
      diagnostic: g('f_diag'), diag2: g('f_diag2'),
      reception: g('f_reception'), verifInit: g('f_verifInit'),
      reglages: g('f_reglages'), formation: g('f_formation'),
    };
    return out;
  }

  // --- enregistrement ---
  const submit = formFooter(r.id ? 'Enregistrer le rapport' : 'Créer le rapport');
  submit.onclick = () => {
    const type = modalBox.querySelector('#f_type').value;
    const date = modalBox.querySelector('#f_date').value;
    const tech = modalBox.querySelector('#f_tech').value.trim();
    const obs  = modalBox.querySelector('#f_obs') ? modalBox.querySelector('#f_obs').value.trim() : '';
    const linkMode = modalBox.querySelector('input[name="f_linkmode"]:checked') ? modalBox.querySelector('input[name="f_linkmode"]:checked').value : 'base';

    if(!date){ markInvalid(modalBox.querySelector('#f_date')); return toast('La date est obligatoire.'); }
    if(!tech){ markInvalid(modalBox.querySelector('#f_tech')); return toast('Le nom du technicien est obligatoire.'); }
    // obs obligatoire seulement si la section obs/controle/rondes est présente (champ f_obs)
    if(modalBox.querySelector('#f_obs') && !obs){ markInvalid(modalBox.querySelector('#f_obs')); return toast('Les observations / contrôles sont obligatoires.'); }

    let link = { siteId:null, buildingId:null, equipmentId:null, equipmentIds:[], siteName:'', buildingName:'', equipmentDesc:'', equipmentList:[] };
    if(linkMode === 'base'){
      if(!siteSel || !siteSel.value){ if(siteSel) markInvalid(siteSel); return toast('Sélectionnez un site ou passez en saisie libre.'); }
      const s = state.sites.find(x => x.id === siteSel.value);
      const b = state.buildings.find(x => x.id === bldSel.value);
      const checkedEqs = [...modalBox.querySelectorAll('#f_eqBox .f_eqChk:checked')]
        .map(c => state.equipment.find(x => x.id === c.value)).filter(Boolean);
      link = {
        siteId:s.id, buildingId:b ? b.id : null,
        equipmentId:checkedEqs[0] ? checkedEqs[0].id : null,
        equipmentIds: checkedEqs.map(e => e.id),
        siteName:s.name, buildingName:b ? b.name : '',
        equipmentDesc: checkedEqs.length === 1 ? eqDesc(checkedEqs[0])
                     : checkedEqs.length ? `${checkedEqs.length} matériel(s) concerné(s)` : '',
        equipmentList: checkedEqs.map(e => eqFullLabel(e)),
      };
    } else {
      link.siteName  = modalBox.querySelector('#f_freeSite') ? modalBox.querySelector('#f_freeSite').value.trim() : '';
      link.buildingName = modalBox.querySelector('#f_freeBld') ? modalBox.querySelector('#f_freeBld').value.trim() : '';
      link.equipmentDesc = modalBox.querySelector('#f_freeEq') ? modalBox.querySelector('#f_freeEq').value.trim() : '';
      if(!link.siteName){ const el = modalBox.querySelector('#f_freeSite'); if(el) markInvalid(el); return toast('Indiquez au moins le site (texte libre).'); }
    }

    const pieces = [];
    modalBox.querySelectorAll('.pieceRow').forEach(row => {
      const d = row.querySelector('.p_d').value.trim();
      if(d) pieces.push({ d, r:row.querySelector('.p_r').value.trim(), q:row.querySelector('.p_q').value.trim() });
    });

    // Champs spécifiques aux profils (récupérés seulement si présents)
    const g = id => { const el = modalBox.querySelector('#'+id); return el ? el.value.trim() : ''; };

    const data = {
      type, date, tech, linkMode, ...link, obs,
      anomalies: g('f_ano'),
      actions: g('f_act'),
      diagnostic: g('f_diag'), diag2: g('f_diag2'),
      reception: g('f_reception'), verifInit: g('f_verifInit'),
      reglages: g('f_reglages'), formation: g('f_formation'),
      reco: g('f_reco'),
      nextVisit: g('f_next'),
      pieces,
      tests: typeof collectTests === 'function' ? collectTests() : [],
      batteries: typeof collectBatteries === 'function' ? collectBatteries() : [],
      sigTech:(pads.tech && !pads.tech.isEmpty()) ? pads.tech.toDataURL('image/png') : null,
      sigClient:(pads.client && !pads.client.isEmpty()) ? pads.client.toDataURL('image/png') : null,
    };

    if(r.id){
      Object.assign(state.reports.find(x => x.id === r.id), data);
    } else {
      const nr = { id:uid(), no:nextReportNo(), createdAt:Date.now(), ...data };
      state.reports.push(nr);
      ui.reportId = nr.id;
    }
    save(); closeModal(); render();
    toast(r.id ? 'Rapport mis à jour.' : 'Rapport créé.', true);
  };
}

</script>
<script data-src="reportrows.js">
/* =====================================================================
   FIREWISE EQUIPMENT CARE — reportrows.js
   Sections dynamiques du rapport :
   - matériel concerné & tests : fusionné dans la check-list (reportform.js)
     → chaque ligne = [checkbox] + libellé + résultat + observation
   - mesures batteries — protocole NF S 61-930 / EN 54-4 :
       · contrôle de charge (tension de flottement, courant de charge)
       · coupure secteur : intensité absorbée par le matériel + U à t0
       · après 1 h : U à t+1 h
       · calculs automatiques :
           Ah consommés (1 h)   = I absorbée × 1 h
           capacité restante (%) = f(U t+1 h) — table indicative bloc 12 V plomb
           autonomie estimée (h) = capacité restante (Ah) / I absorbée
           résultat proposé comparé à l'autonomie requise
===================================================================== */

const TEST_RESULTS = { conforme:'Conforme', surveil:'À surveiller', nonconforme:'Non conforme' };
const BATTERY_RESULTS = { conforme:'Conforme', surveil:'À surveiller', remplacer:'À remplacer' };

// Estimation indicative de l'état de charge d'un bloc 12 V plomb
// d'après la tension mesurée (valeurs approchées, matériel en fonctionnement)
const SOC_TABLE = [
  [12.7, 100],
  [12.5, 80],
  [12.3, 60],
  [12.1, 40],
  [11.9, 20],
  [11.7, 0],
];
function socFromU(u, unom){
  if(u === null || !(unom > 0)) return null;
  const ub = u * 12 / unom; // normalise à un bloc 12 V (ex. : 24,9 V → 12,45 V)
  if(ub >= SOC_TABLE[0][0]) return 100;
  if(ub <= SOC_TABLE[SOC_TABLE.length - 1][0]) return 0;
  for(let i = 0; i < SOC_TABLE.length - 1; i++){
    const uh = SOC_TABLE[i][0], sh = SOC_TABLE[i][1];
    const ub2 = SOC_TABLE[i+1][0], sb = SOC_TABLE[i+1][1];
    if(ub <= uh && ub >= ub2){
      return Math.round((sb + (ub - ub2) / (uh - ub2) * (sh - sb)) * 10) / 10;
    }
  }
  return null;
}

// Libellé complet d'un matériel du registre (avec site, bâtiment, localisation)
function eqFullLabel(e){
  const s = state.sites.find(x => x.id === e.siteId);
  const b = state.buildings.find(x => x.id === e.buildingId);
  const loc = [s ? s.name : '', b ? b.name : '', e.loc || ''].filter(Boolean).join(' · ');
  return eqDesc(e) + (loc ? ' — ' + loc : '');
}

/* ---------- Mesures batteries (protocole complet) ---------- */
function batteriesFieldsetHTML(r){
  const rows = (r.batteries && r.batteries.length ? r.batteries : [{}]);
  return `
    <fieldset class="fs"><legend>Mesures batteries — autonomie (NF S 61-930)</legend>
      <p class="hint" style="margin-bottom:10px">
        <b>Protocole (NF S 61-930) :</b> couper le secteur, relever le <b>courant absorbé</b> et la <b>tension au début (t0)</b>,
        puis la <b>tension après 1 h</b>. L’autonomie estimée et la capacité restante sont calculées automatiquement
        (table indicative bloc 12 V plomb) et comparées à l’autonomie requise. Se référer aux tables constructeur
        pour un contrôle certifié.
      </p>
      <div id="batteriesBox">${rows.map(b => batteryRowHTML(b)).join('')}</div>
      <div><button type="button" class="mini" id="addBattery">+ Ajouter des mesures</button></div>
    </fieldset>`;
}

function batteryRowHTML(b = {}){
  const ro = 'readonly style="background:#f2f1ef;color:var(--ink-2)"';
  return `
    <div class="batRow" style="border:1px solid var(--line);border-radius:6px;padding:10px;margin-bottom:8px">
      <div style="display:grid;grid-template-columns:1fr 110px 110px;gap:8px">
        <input class="b_mat" placeholder="Matériel concerné (ex. : CDS boucles 1-2)" value="${esc(b.mat||'')}">
        <input class="b_cnom" inputmode="decimal" placeholder="Capacité (Ah)" value="${esc(b.cnom||'')}">
        <input class="b_unom" inputmode="decimal" placeholder="Tension (V)" value="${esc(b.unom||'')}">
      </div>
      <div style="margin:8px 0 4px;font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:0.04em">Test — secteur coupé, 1 h</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <input class="b_iabs" inputmode="decimal" placeholder="Courant absorbé (A)" value="${esc(b.iabs||'')}">
        <input class="b_ut0" inputmode="decimal" placeholder="Tension début t0 (V)" value="${esc(b.ut0||'')}">
        <input class="b_ut1" inputmode="decimal" placeholder="Tension après 1 h (V)" value="${esc(b.ut1||'')}">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr 130px;gap:8px;margin-top:8px;align-items:center">
        <input class="b_areq" inputmode="decimal" placeholder="Autonomie requise (h)" value="${esc(b.areq||'')}">
        <input class="b_aut" ${ro} placeholder="Autonomie estimée (h) — auto" value="${esc(b.aut||'')}">
        <select class="b_res">
          <option value="nonteste" ${(!b.res || b.res === 'nonteste') ? 'selected' : ''}>Non testé</option>
          ${Object.entries(BATTERY_RESULTS).map(([v,l]) => `<option value="${v}" ${v===b.res?'selected':''}>${l}</option>`).join('')}
        </select>
      </div>
      <div style="display:grid;grid-template-columns:1fr 130px;gap:8px;margin-top:6px;align-items:center">
        <input class="b_note" placeholder="Observation" value="${esc(b.note||'')}">
        <input class="b_cmes" ${ro} placeholder="% restant — auto" value="${esc(b.cmes||'')}" style="text-align:right">
      </div>
      <div style="text-align:right;margin-top:6px"><button type="button" class="mini del b_del">Retirer</button></div>
    </div>`;
}

// Calculs automatiques de la ligne batteries
function batCompute(row){
  const num = sel => {
    const v = (row.querySelector(sel).value || '').trim().replace(',', '.');
    const n = parseFloat(v);
    return isFinite(n) ? n : null;
  };
  const cn = num('.b_cnom');   // capacité nominale (Ah)
  const un = num('.b_unom');   // tension nominale (V)
  const ia = num('.b_iabs');   // intensité absorbée (A)
  const ar = num('.b_areq');   // autonomie requise (h)
  const u0 = num('.b_ut0'), u1 = num('.b_ut1');

  // Capacité restante estimée (%) d'après U(t+1h), ou U(t0) si absente
  const soc = socFromU(u1 !== null ? u1 : u0, un || 12);
  if(soc !== null) row.querySelector('.b_cmes').value = String(soc);

  // Autonomie estimée (h) = capacité restante (Ah) / I absorbée
  let aut = null;
  if(soc !== null && ia !== null && ia > 0 && cn && cn > 0){
    aut = (soc / 100 * cn) / ia;
    row.querySelector('.b_aut').value = String(Math.round(aut * 10) / 10);
  }

  // Proposition de résultat vs autonomie requise (sans écraser un choix manuel)
  const resSel = row.querySelector('.b_res');
  if(resSel.value === 'nonteste' || resSel.value === ''){
    if(aut !== null && ar && ar > 0){
      resSel.value = aut >= ar ? 'conforme' : (aut >= ar * 0.8 ? 'surveil' : 'remplacer');
    }
  }
}

function wireBatteryRow(row){
  row.querySelector('.b_del').onclick = () => row.remove();
  ['.b_iabs', '.b_cnom', '.b_unom', '.b_ut0', '.b_ut1', '.b_areq'].forEach(c =>
    row.querySelector(c).addEventListener('input', () => batCompute(row)));
  batCompute(row);
}

/* ---------- Câblage & collecte ---------- */
function wireReportRows(){
  // Les lignes batteries (le matériel concerné & tests est câblé dans reportform.js)
  // La section batteries peut ne pas être rendue (pas de matériel à batterie) →
  // on vérifie l'existence de #addBattery avant de le câbler.
  modalBox.querySelectorAll('.batRow').forEach(wireBatteryRow);
  const addBtn = modalBox.querySelector('#addBattery');
  if(addBtn){
    addBtn.onclick = () => {
      const box = modalBox.querySelector('#batteriesBox');
      if(!box) return;
      box.insertAdjacentHTML('beforeend', batteryRowHTML());
      wireBatteryRow(box.lastElementChild);
    };
  }
}

// Collecte du matériel concerné & tests depuis les lignes unifiées (#f_eqBox)
function collectTests(){
  const linkMode = (modalBox.querySelector('input[name="f_linkmode"]:checked') || {}).value;
  const out = [];
  modalBox.querySelectorAll('#f_eqBox .eqRow').forEach(row => {
    const eqId = row.dataset.eqid || null;
    if(eqId){
      // Ligne registre : incluse seulement en mode base et si cochée
      if(linkMode !== 'base') return;
      const chk = row.querySelector('.f_eqChk');
      if(chk && !chk.checked) return;
    }
    const res = row.querySelector('.t_res').value || 'nonteste';
    const note = row.querySelector('.t_note').value.trim();
    let label = '';
    if(eqId){
      const e = state.equipment.find(x => x.id === eqId);
      if(e) label = eqFullLabel(e);
    } else {
      label = row.querySelector('.t_free').value.trim();
    }
    if(label || note) out.push({ eqId, label, res, note });
  });
  return out;
}

function collectBatteries(){
  const out = [];
  modalBox.querySelectorAll('.batRow').forEach(row => {
    const g = c => row.querySelector(c).value.trim();
    const item = {
      mat:g('.b_mat'),
      cnom:g('.b_cnom'), unom:g('.b_unom'),
      iabs:g('.b_iabs'), ut0:g('.b_ut0'), ut1:g('.b_ut1'),
      areq:g('.b_areq'),
      cmes:g('.b_cmes'), aut:g('.b_aut'),
      res:g('.b_res') || 'nonteste', note:g('.b_note'),
    };
    if(item.mat || item.cnom || item.unom || item.iabs || item.ut0 || item.ut1 ||
       item.areq || item.cmes || item.aut || item.note) out.push(item);
  });
  return out;
}

/* ===== FIN DE reportrows.js ===== */

</script>
<script data-src="exports.js">
/* =====================================================================

/* ---------- 13. Exports (PDF / Word) ---------- */
function exportPDF(reportId){
  const r = state.reports.find(x => x.id === reportId);
  if(!r) return;
  if(typeof html2pdf === 'undefined'){ return toast('Bibliothèque PDF non chargée : vérifiez votre connexion réseau.'); }

}

function b64ToU8(b64){
  const bin = atob(String(b64).split(',')[1] || '');
  const u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

function exportDOCX(reportId){
  const r = state.reports.find(x => x.id === reportId);
  if(!r) return;
  const D = window.docx;
  if(!D || !D.Document){ return toast('Bibliothèque Word non chargée : vérifiez votre connexion réseau.'); }

  const border = { style: D.BorderStyle.SINGLE, size: 4, color: '444444' };
  const cellBorders = { top:border, bottom:border, left:border, right:border };
  const cell = (text, opts = {}) => new D.TableCell({
    borders: cellBorders,
    margins: { top: 60, bottom: 60, left: 100, right: 100 },
    width: opts.w ? { size: opts.w, type: D.WidthType.PERCENTAGE } : undefined,
    shading: opts.head ? { fill: 'EFECEB' } : undefined,
    children: [new D.Paragraph({ children: [new D.TextRun({ text: text || '—', bold: !!opts.head, size: opts.head ? 19 : 20 })] })],
  });
  const sec = title => new D.Paragraph({
    spacing: { before: 220, after: 90 },
    border: { bottom: { style: D.BorderStyle.SINGLE, size: 4, color: '555555' } },
    children: [new D.TextRun({ text: title.toUpperCase(), bold: true, size: 19, color: '444444' })],
  });
  const para = (t, opts = {}) => new D.Paragraph({
    spacing: { after: 60 },
    children: [new D.TextRun({ text: t || '—', size: 20, italics: !!opts.i })],
  });
  const img = data => new D.Paragraph({
    children: [new D.ImageRun({ data: b64ToU8(data), transformation: { width: 220, height: 68 } })],
  });

  const pieces = (r.pieces || []);
  const tests = (r.tests || []);
  const batteries = (r.batteries || []);
  const profile = REPORT_PROFILES[r.type] || REPORT_PROFILES.maintenance;
  const secHas = k => profile.sections.includes(k);
  const paraOr = (t, empty) => para(t || empty);

  const piecesTable = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    rows: [
      new D.TableRow({ tableHeader: true, children: [cell('Désignation', { head:true }), cell('Référence', { head:true }), cell('Qté', { head:true, w:12 })] }),
      ...(pieces.length ? pieces.map(p => new D.TableRow({ children: [cell(p.d), cell(p.r), cell(p.q)] }))
        : [new D.TableRow({ children: [cell('Aucune pièce remplacée'), cell(''), cell('')] })]),

  const testedTable = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    rows: [
      new D.TableRow({ tableHeader: true, children: [cell('Matériel', { head:true }), cell('Résultat', { head:true, w:18 }), cell('Observation', { head:true })] }),
      ...(tests.length ? tests.map(t => new D.TableRow({ children: [cell(t.label), cell(TEST_RESULTS[t.res]||'—'), cell(t.note)] }))
        : [new D.TableRow({ children: [cell('Aucun matériel concerné'), cell(''), cell('')] })]),
    ],
  });

    const batteriesTable = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    rows: [
      new D.TableRow({ tableHeader: true, children: [
        cell('Matériel', { head:true }), cell('Batterie', { head:true, w:14 }),
        cell('Mesures (I · U t0→1h)', { head:true, w:18 }),
        cell('Autonomie / capacité', { head:true, w:18 }),
        cell('Résultat', { head:true, w:13 }),
        cell('Observation', { head:true }),
      ]}),
      ...(batteries.length ? batteries.map(b => {
        const batTxt = [b.cnom ? b.cnom + ' Ah' : '', b.unom ? b.unom + ' V' : ''].filter(Boolean).join(' · ') || '—';
        const testTxt = [b.iabs ? 'I ' + b.iabs + ' A' : '', (b.ut0 || b.ut1) ? (b.ut0||'?') + ' → ' + (b.ut1||'?') + ' V' : ''].filter(Boolean).join(' · ') || '—';
        const capTxt = [b.aut ? b.aut + ' h' : '', b.areq ? '/ ' + b.areq + ' h requis' : '', b.cmes ? '· ' + b.cmes + ' %' : ''].filter(Boolean).join(' ') || '—';
        return new D.TableRow({ children: [
          cell(b.mat), cell(batTxt), cell(testTxt), cell(capTxt),

      }) : [new D.TableRow({ children: [cell('Aucune mesure relevée'), cell(''), cell(''), cell(''), cell(''), cell('')] })]),
    ],

  const children = [
    new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing:{ after: 40 },
      children: [new D.TextRun({ text: "RAPPORT D'INTERVENTION SSI", bold: true, size: 34 })] }),
    new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing:{ after: 8 },

      new D.TableRow({ children: [cell('Date', { head:true, w:16 }), cell(fmtDate(r.date), { w:34 }), cell('Technicien', { head:true, w:16 }), cell(r.tech, { w:34 })] }),
      new D.TableRow({ children: [cell('Objet', { head:true, w:16 }), cell(reportObjet(r))] }),
    ]}),
    ...(tests.length ? [sec('Matériel concerné & tests'), testedTable] : []),
    ...(secHas('reception') ? [sec('Réception d’installation'), paraOr(r.reception, 'Non renseignée.')] : []),
    ...(secHas('diagnostic') ? [sec('Diagnostic'), paraOr(r.diagnostic, 'Aucun défaut signalé.'),
                                 ...(r.diag2 ? [sec('Analyse & origine'), para(r.diag2)] : [])] : []),
    ...(secHas('reglages') ? [sec('Réglages & paramétrage'), paraOr(r.reglages, 'Non renseignés.')] : []),
    ...(secHas('controle') ? [sec('Contrôles & essais'), paraOr(r.obs, '—')] : []),
    ...(secHas('rondes') ? [sec('Rondes & contrôles visuels'), paraOr(r.obs, '—')] : []),
    ...(secHas('obs') ? [sec('Observations / constat'), paraOr(r.obs, '—')] : []),
    sec('Anomalies constatées'), paraOr(r.anomalies, 'Aucune anomalie relevée.'),
    sec('Actions réalisées'), paraOr(r.actions, '—'),
    sec('Pièces remplacées'), piecesTable,
    ...(batteries.length ? [sec('Mesures batteries'), batteriesTable] : []),
    ...(secHas('formation') ? [sec('Formation & remise'), paraOr(r.formation, 'Aucune formation mentionnée.')] : []),
    sec('Recommandations'), paraOr(r.reco, '—'),
    sec('Prochaine visite'), para(r.nextVisit ? fmtDate(r.nextVisit) : 'Non planifiée.'),
    sec('Signatures'),
    new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [
      new D.TableRow({ children: [
        new D.TableCell({ borders: cellBorders, margins:{ top:60,bottom:60,left:100,right:100 },
          children: [new D.Paragraph({ children:[new D.TextRun({ text:'Technicien', bold:true, size:18, color:'555555' })] }),
                     ...(r.sigTech ? [img(r.sigTech)] : [para('Non signé', { i:true })])] }),
        new D.TableCell({ borders: cellBorders, margins:{ top:60,bottom:60,left:100,right:100 },
          children: [new D.Paragraph({ children:[new D.TextRun({ text:'Client / représentant', bold:true, size:18, color:'555555' })] }),
                     ...(r.sigClient ? [img(r.sigClient)] : [para('Non signé', { i:true })])] }),
      ]}),
    ]}),
    new D.Paragraph({ spacing:{ before: 200 }, children: [new D.TextRun({
      text: `Document généré le ${fmtDate(todayISO())} par Firewise Equipment Care — ${r.no}`,
      size: 16, color: '888888' })] }),
  ];

  try{
    const doc = new D.Document({ sections: [{ properties: {}, children }] });
    D.Packer.toBlob(doc).then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${r.no}-${slug(REPORT_TYPES[r.type]||'rapport')}.docx`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Document Word généré.', true);
    }).catch(() => toast('Échec de la génération Word.'));
  }catch(e){
    toast('Échec de la génération Word : ' + e.message);
  }
}

/* ===== FIN DE exports.js ===== */
</script>
<script data-src="sync.js">
/* =====================================================================
   FIREWISE EQUIPMENT CARE — sync.js
   Synchronisation multi-backend : WebDAV, endpoint HTTP, GitHub Gist
   ---------------------------------------------------------------------
   Note protocole : les navigateurs modernes (Chrome 86+, Firefox 88+,
   Safari 14+) ont retiré le support du protocole FTP dans fetch().
   WebDAV couvre la majorité des besoins « FTP-like » : Nextcloud,
   ownCloud, Synology Drive, Box, Koofr, pCloud, etc. GitHub Gist offre
   une option « sans serveur ».

   Sécurité : les credentials et la passphrase sont stockés dans
   localStorage (clé `firewise.sync`), séparés des données applicatives.
   Chiffrement optionnel AES-GCM + PBKDF2 côté client : le payload
   envoyé sur le réseau est alors illisible sans la passphrase.
   ===================================================================== */

const SYNC_KEY = 'firewise.sync';

const SYNC_BACKENDS = [
  { id:'webdav', label:'WebDAV',    desc:'Nextcloud, ownCloud, Synology Drive, Box, Koofr…' },
  { id:'http',   label:'HTTP',      desc:'Endpoint personnel : GET (lecture) + PUT (écriture)' },
  { id:'gist',   label:'GitHub Gist', desc:'Sans serveur — token GitHub, gist privé' },
];

const SYNC_DEFAULTS = {
  enabled:false,
  backend:'webdav',
  encrypt:false,
  passphrase:'',
  autoSync:false,
  autoSyncDelay:30,
  lastSync:0,
  lastDirection:'',
  lastError:'',
  deviceId:'',
  // WebDAV
  webdavUrl:'',
  webdavUser:'',
  webdavPass:'',
  // HTTP
  httpUrl:'',
  httpToken:'',
  // Gist
  gistToken:'',
  gistId:'',
  gistFilename:'firewise-backup.json',
};

let syncConfig = null;
let _syncTimer = null;
let _syncBusy = false;

function loadSync(){
  try{
    const raw = localStorage.getItem(SYNC_KEY);
    syncConfig = Object.assign({}, SYNC_DEFAULTS, raw ? JSON.parse(raw) : {});
  }catch(e){ syncConfig = Object.assign({}, SYNC_DEFAULTS); }
  if(!syncConfig.deviceId){
    syncConfig.deviceId = 'dev-' + uid();
    try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig)); }catch(e){}
  }
  return syncConfig;
}
function saveSyncConfig(){
  try{ localStorage.setItem(SYNC_KEY, JSON.stringify(syncConfig)); }catch(e){}
}

/* ---------- Sérialisation payload ---------- */
function syncSerialize(){
  return JSON.stringify({
    app:'firewise',
    v:1,
    syncedAt: Date.now(),
    deviceId: syncConfig.deviceId,
    data: state,
  });
}

/* ---------- Chiffrement optionnel (AES-GCM + PBKDF2) ---------- */
async function syncDeriveKey(passphrase, salt){
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey('raw', enc.encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:120000, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
function _b64(buf){
  const b = new Uint8Array(buf);
  let s = ''; for(let i=0;i<b.length;i++) s += String.fromCharCode(b[i]);
  return btoa(s);
}
function _unb64(str){
  const s = atob(str);
  const b = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) b[i] = s.charCodeAt(i);
  return b;
}
async function syncEncrypt(jsonStr){
  if(!syncConfig.encrypt || !syncConfig.passphrase) return jsonStr;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await syncDeriveKey(syncConfig.passphrase, salt);
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, key, new TextEncoder().encode(jsonStr));
  return JSON.stringify({ enc:true, salt:_b64(salt), iv:_b64(iv), ct:_b64(ct) });
}
async function syncDecrypt(str){
  let obj;
  try{ obj = JSON.parse(str); }catch(e){ return str; } // payload brut non-JSON
  if(!obj || obj.enc !== true) return str;             // pas chiffré
  if(!syncConfig.passphrase) throw new Error('Passphrase requise pour déchiffrer le distant.');
  const salt = _unb64(obj.salt), iv = _unb64(obj.iv);
  const key = await syncDeriveKey(syncConfig.passphrase, salt);
  try{
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, _unb64(obj.ct));
    return new TextDecoder().decode(pt);
  }catch(e){ throw new Error('Déchiffrement impossible : passphrase erronée ou payload corrompu.'); }
}

/* ---------- Backends : abstraction GET / PUT ---------- */
async function backendWebDAVGet(){
  if(!syncConfig.webdavUrl) throw new Error('URL WebDAV manquante.');
  const headers = {};
  if(syncConfig.webdavUser)
    headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(syncConfig.webdavUser + ':' + syncConfig.webdavPass)));
  const r = await fetch(syncConfig.webdavUrl, { method:'GET', headers });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('WebDAV GET → ' + r.status + ' ' + r.statusText);
  return await r.text();
}
async function backendWebDAVPut(body){
  if(!syncConfig.webdavUrl) throw new Error('URL WebDAV manquante.');
  const headers = { 'Content-Type':'application/json' };
  if(syncConfig.webdavUser)
    headers['Authorization'] = 'Basic ' + btoa(unescape(encodeURIComponent(syncConfig.webdavUser + ':' + syncConfig.webdavPass)));
  // Créer le dossier parent si nécessaire (best-effort, on ignore l'échec)
  try{
    const u = new URL(syncConfig.webdavUrl, location.href);
    const parts = u.pathname.split('/').filter(Boolean);
    if(parts.length > 1){
      for(let i = 1; i < parts.length; i++){
        const dir = u.origin + '/' + parts.slice(0, i).join('/') + '/';
        await fetch(dir, { method:'MKCOL', headers }).catch(()=>{});
      }
    }
  }catch(e){ /* ignore */ }
  const r = await fetch(syncConfig.webdavUrl, { method:'PUT', headers, body });
  if(!r.ok) throw new Error('WebDAV PUT → ' + r.status + ' ' + r.statusText);
}

async function backendHTTPGet(){
  if(!syncConfig.httpUrl) throw new Error('URL HTTP manquante.');
  const headers = {};
  if(syncConfig.httpToken) headers['Authorization'] = 'Bearer ' + syncConfig.httpToken;
  const r = await fetch(syncConfig.httpUrl, { method:'GET', headers });
  if(r.status === 404) return null;
  if(!r.ok) throw new Error('HTTP GET → ' + r.status);
  const txt = await r.text();
  // Le serveur peut renvoyer le payload brut, ou { data:"..." }
  try{
    const j = JSON.parse(txt);
    if(j && typeof j === 'object' && typeof j.data === 'string') return j.data;
  }catch(e){ /* payload brut */ }
  return txt;
}
async function backendHTTPPut(body){
  if(!syncConfig.httpUrl) throw new Error('URL HTTP manquante.');
  const headers = { 'Content-Type':'application/json' };
  if(syncConfig.httpToken) headers['Authorization'] = 'Bearer ' + syncConfig.httpToken;
  const r = await fetch(syncConfig.httpUrl, { method:'PUT', headers, body });
  if(!r.ok) throw new Error('HTTP PUT → ' + r.status);
}

async function backendGistGet(){
  if(!syncConfig.gistToken) throw new Error('Token GitHub manquant.');
  const fn = syncConfig.gistFilename || 'firewise-backup.json';
  if(!syncConfig.gistId){
    // Rechercher un gist existant portant notre nom de fichier
    const r = await fetch('https://api.github.com/gists?per_page=100', {
      headers:{ 'Authorization':'Bearer ' + syncConfig.gistToken, 'Accept':'application/vnd.github+json' }
    });
    if(!r.ok) throw new Error('Gist list → ' + r.status);
    const gists = await r.json();
    const found = (gists || []).find(g => g.files && g.files[fn]);
    if(found){ syncConfig.gistId = found.id; saveSyncConfig(); }
    else return null;
  }
  const r = await fetch('https://api.github.com/gists/' + syncConfig.gistId, {
    headers:{ 'Authorization':'Bearer ' + syncConfig.gistToken, 'Accept':'application/vnd.github+json' }
  });
  if(r.status === 404){ syncConfig.gistId = ''; saveSyncConfig(); return null; }
  if(!r.ok) throw new Error('Gist GET → ' + r.status);
  const g = await r.json();
  const f = g.files && g.files[fn];
  if(!f || !f.content) return null;
  return f.content;
}
async function backendGistPut(body){
  if(!syncConfig.gistToken) throw new Error('Token GitHub manquant.');
  const fn = syncConfig.gistFilename || 'firewise-backup.json';
  const headers = { 'Authorization':'Bearer ' + syncConfig.gistToken, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json' };
  if(syncConfig.gistId){
    const r = await fetch('https://api.github.com/gists/' + syncConfig.gistId, {
      method:'PATCH', headers,
      body: JSON.stringify({ files:{ [fn]:{ content: body } } })
    });
    if(!r.ok) throw new Error('Gist PATCH → ' + r.status);
  } else {
    const r = await fetch('https://api.github.com/gists', {
      method:'POST', headers,
      body: JSON.stringify({ description:'Firewise Equipment Care — sauvegarde', public:false, files:{ [fn]:{ content: body } } })
    });
    if(!r.ok) throw new Error('Gist POST → ' + r.status);
    const g = await r.json();
    syncConfig.gistId = g.id; saveSyncConfig();
  }
}

function backendGet(){
  if(syncConfig.backend === 'webdav') return backendWebDAVGet();
  if(syncConfig.backend === 'http')   return backendHTTPGet();
  if(syncConfig.backend === 'gist')   return backendGistGet();
  return Promise.reject(new Error('Aucun backend configuré.'));
}
function backendPut(body){
  if(syncConfig.backend === 'webdav') return backendWebDAVPut(body);
  if(syncConfig.backend === 'http')   return backendHTTPPut(body);
  if(syncConfig.backend === 'gist')   return backendGistPut(body);
  return Promise.reject(new Error('Aucun backend configuré.'));
}

/* ---------- Test de connexion ---------- */
async function syncTest(){
  if(syncConfig.backend === 'gist' && !syncConfig.gistId){
    if(!syncConfig.gistToken) throw new Error('Token GitHub manquant.');
    const r = await fetch('https://api.github.com/user', { headers:{ 'Authorization':'Bearer ' + syncConfig.gistToken } });
    if(!r.ok) throw new Error('Token GitHub invalide (' + r.status + ').');
    const u = await r.json();
    // Cherche ensuite un gist existant
    const txt = await backendGistGet();
    if(txt === null) return 'Token OK (utilisateur : ' + (u.login||'?') + '). Aucun backup distant — premier push à faire.';
    return _probeRemote(txt, 'utilisateur ' + (u.login||'?'));
  }
  const txt = await backendGet();
  if(txt === null) return 'Connexion OK — aucun backup distant trouvé (premier push à effectuer).';
  return _probeRemote(txt, '');
}
async function _probeRemote(txt, extra){
  let obj = null;
  try{ const dec = await syncDecrypt(txt); obj = JSON.parse(dec); }
  catch(e){ throw new Error('Backup distant illisible : ' + e.message); }
  if(!obj || obj.app !== 'firewise') throw new Error('Le distant contient un fichier non-Firewise.');
  const when = new Date(obj.syncedAt).toLocaleString('fr-FR');
  const dev = obj.deviceId ? ('appareil ' + String(obj.deviceId).slice(0,10) + '…') : 'appareil inconnu';
  return 'Connexion OK — backup distant trouvé (sync ' + when + ', ' + dev + (extra ? ', ' + extra : '') + ').';
}

/* ---------- Push / Pull ---------- */
async function syncPush(force){
  syncConfig.lastError = '';
  // Récupérer le distant pour détecter un conflit (un autre appareil a poussé depuis notre dernière synchro)
  let remoteStr = null, remote = null;
  try{ remoteStr = await backendGet(); }catch(e){ /* 404 ou erreur réseau — non fatal pour un premier push */ }
  if(remoteStr !== null){
    try{ const dec = await syncDecrypt(remoteStr); remote = JSON.parse(dec); }
    catch(e){ throw new Error('Distant illisible (passphrase différente ?) : ' + e.message); }
  }
  if(!force && remote && remote.syncedAt && remote.deviceId !== syncConfig.deviceId
     && remote.syncedAt > syncConfig.lastSync){
    const diffMin = Math.max(1, Math.round((Date.now() - remote.syncedAt) / 60000));
    const e = new Error('Conflit : le distant a été modifié par un autre appareil il y a environ ' + diffMin + ' min. Pousser écrasera ces modifications.');
    e.conflict = true; e.remote = remote;
    throw e;
  }
  const body = await syncEncrypt(syncSerialize());
  await backendPut(body);
  syncConfig.lastSync = Date.now();
  syncConfig.lastDirection = 'push';
  saveSyncConfig();
  return true;
}

async function syncPull(){
  syncConfig.lastError = '';
  const remoteStr = await backendGet();
  if(remoteStr === null) throw new Error('Aucun backup distant trouvé. Effectuez d\'abord un push depuis cet appareil.');
  const dec = await syncDecrypt(remoteStr);
  const obj = JSON.parse(dec);
  if(!obj || obj.app !== 'firewise') throw new Error('Le distant n\'est pas un backup Firewise.');
  if(!obj.data || !Array.isArray(obj.data.sites)) throw new Error('Payload distant invalide.');
  state = {
    sites: obj.data.sites || [],
    buildings: obj.data.buildings || [],
    equipment: obj.data.equipment || [],
    reports: obj.data.reports || [],
    catalog: obj.data.catalog || [],
  };
  save();
  syncConfig.lastSync = obj.syncedAt || Date.now();
  syncConfig.lastDirection = 'pull';
  saveSyncConfig();
  return true;
}

/* ---------- Auto-sync : appelé après chaque save() local ---------- */
function scheduleAutoSync(){
  if(!syncConfig || !syncConfig.enabled || !syncConfig.autoSync) return;
  if(_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(async () => {
    _syncTimer = null;
    if(_syncBusy) return;
    _syncBusy = true;
    try{
      await syncPush(true); // auto-sync = force (pas de prompt de conflit)
    }catch(e){
      syncConfig.lastError = (e && e.message) || String(e);
      saveSyncConfig();
    }finally{ _syncBusy = false; }
  }, Math.max(5, syncConfig.autoSyncDelay || 30) * 1000);
}
// Hook appelé par core.save() après persistance locale
function onSyncSave(){ scheduleAutoSync(); }

/* ---------- UI : panneau de Réglages ---------- */
function renderSyncPanelHTML(){
  const c = syncConfig;
  const lastTxt = c.lastSync ? new Date(c.lastSync).toLocaleString('fr-FR') : 'jamais';
  const dirTxt = c.lastDirection === 'push' ? '↑ Poussé' : c.lastDirection === 'pull' ? '↓ Tiré' : '—';
  const err = c.lastError
    ? `<div class="sync-err">⚠ ${esc(c.lastError)}</div>` : '';
  const desc = (SYNC_BACKENDS.find(b => b.id === c.backend) || {}).desc || '';

  return `<div class="panel" id="syncPanel">
    <div class="panel-h"><h2>Synchronisation cloud</h2></div>
    <div class="panel-b" style="padding-top:14px">
      <p class="hint" style="margin-bottom:14px">
        Synchronisez vos données entre plusieurs appareils via WebDAV, un endpoint HTTP,
        ou GitHub Gist. <b>Le protocole FTP pur n'est plus supporté par les navigateurs
        modernes</b> (Chrome, Firefox, Safari l'ont retiré de <code>fetch</code>) —
        WebDAV couvre Nextcloud, ownCloud, Synology Drive, Box, Koofr…
      </p>

      <label class="fld fld-row">
        <span>Activer la synchronisation</span>
        <input type="checkbox" id="syncEnabled" ${c.enabled?'checked':''}>
      </label>

      <div class="fld">
        <span>Backend</span>
        <div class="seg">
          ${SYNC_BACKENDS.map(b => `<button type="button" class="seg-btn ${c.backend===b.id?'active':''}" data-be="${b.id}">${b.label}</button>`).join('')}
        </div>
        <span class="hint">${esc(desc)}</span>
      </div>

      <div id="syncFields">${renderSyncFieldsHTML()}</div>

      <label class="fld fld-row">
        <span>Chiffrer la sauvegarde (AES-GCM + passphrase)</span>
        <input type="checkbox" id="syncEnc" ${c.encrypt?'checked':''}>
      </label>
      <div class="fld" id="syncPassFld" style="${c.encrypt?'':'display:none'}">
        <span>Passphrase</span>
        <input type="password" id="syncPass" value="${esc(c.passphrase)}" placeholder="Phrase secrète" autocomplete="new-password">
      </div>

      <label class="fld fld-row">
        <span>Synchronisation automatique après chaque modification</span>
        <input type="checkbox" id="syncAuto" ${c.autoSync?'checked':''}>
      </label>
      <div class="fld" id="syncDelayFld" style="${c.autoSync?'':'display:none'}">
        <span>Délai avant synchro (secondes)</span>
        <input type="number" id="syncDelay" value="${c.autoSyncDelay||30}" min="5" max="600" style="max-width:120px">
      </div>

      <div class="sync-status">
        <div><span class="lab">Dernière synchro</span><b>${esc(lastTxt)}</b></div>
        <div><span class="lab">Sens</span><b>${dirTxt}</b></div>
        <div><span class="lab">Appareil</span><b title="${esc(c.deviceId)}">${esc(String(c.deviceId).slice(0,12))}…</b></div>
      </div>
      ${err}

      <div class="sync-actions">
        <button type="button" class="btn" id="syncTest">Tester</button>
        <button type="button" class="btn" id="syncPull">↓ Tirer</button>
        <button type="button" class="btn primary" id="syncPush">↑ Pousser</button>
      </div>
    </div>
  </div>`;
}

function renderSyncFieldsHTML(){
  const c = syncConfig;
  if(c.backend === 'webdav'){
    return `
      <div class="fld">
        <span>URL du fichier WebDAV (https://…)</span>
        <input type="url" id="syncWebdavUrl" value="${esc(c.webdavUrl)}" placeholder="https://cloud.exemple.fr/remote.php/dav/files/user/Firewise/firewise-backup.json">
      </div>
      <div class="fld">
        <span>Utilisateur <span class="hint" style="display:inline">(optionnel si URL publique)</span></span>
        <input type="text" id="syncWebdavUser" value="${esc(c.webdavUser)}" autocomplete="off">
      </div>
      <div class="fld">
        <span>Mot de passe / token d'application</span>
        <input type="password" id="syncWebdavPass" value="${esc(c.webdavPass)}" autocomplete="new-password">
      </div>
      <p class="hint">Nextcloud : Préférences → Sécurité → « Mot de passe d'application ».<br>
      Synology : DSM → File Station → partage WebDAV activé.</p>`;
  }
  if(c.backend === 'http'){
    return `
      <div class="fld">
        <span>URL endpoint HTTP</span>
        <input type="url" id="syncHttpUrl" value="${esc(c.httpUrl)}" placeholder="https://serveur.fr/api/firewise">
      </div>
      <div class="fld">
        <span>Token Bearer <span class="hint" style="display:inline">(optionnel)</span></span>
        <input type="password" id="syncHttpToken" value="${esc(c.httpToken)}" autocomplete="new-password">
      </div>
      <p class="hint">Le serveur doit accepter <code>GET</code> (renvoie le payload JSON) et
      <code>PUT</code> (reçoit le payload JSON dans le corps).</p>`;
  }
  if(c.backend === 'gist'){
    return `
      <div class="fld">
        <span>Token GitHub (Personal Access Token, scope « gist » uniquement)</span>
        <input type="password" id="syncGistToken" value="${esc(c.gistToken)}" autocomplete="new-password" placeholder="ghp_…">
      </div>
      <div class="fld">
        <span>ID du Gist <span class="hint" style="display:inline">(vide = créé automatiquement au 1er push)</span></span>
        <input type="text" id="syncGistId" value="${esc(c.gistId)}" placeholder="auto">
      </div>
      <div class="fld">
        <span>Nom de fichier</span>
        <input type="text" id="syncGistFn" value="${esc(c.gistFilename)}">
      </div>
      <p class="hint">Créez un token sur <code>github.com/settings/tokens</code> (cochez seulement « gist »).
      Le gist est créé <b>privé</b>. Limite GitHub : ~1 Mo par fichier.</p>`;
  }
  return '';
}

function bindSyncPanel(v){
  const wrap = v.querySelector('#syncPanel');
  if(!wrap) return;

  const readFields = () => {
    syncConfig.enabled   = v.querySelector('#syncEnabled').checked;
    syncConfig.autoSync  = v.querySelector('#syncAuto').checked;
    syncConfig.encrypt   = v.querySelector('#syncEnc').checked;
    syncConfig.autoSyncDelay = parseInt((v.querySelector('#syncDelay')||{}).value, 10) || 30;
    syncConfig.passphrase = (v.querySelector('#syncPass')||{}).value || '';
    if(syncConfig.backend === 'webdav'){
      syncConfig.webdavUrl  = (v.querySelector('#syncWebdavUrl')||{}).value || '';
      syncConfig.webdavUser = (v.querySelector('#syncWebdavUser')||{}).value || '';
      syncConfig.webdavPass = (v.querySelector('#syncWebdavPass')||{}).value || '';
    } else if(syncConfig.backend === 'http'){
      syncConfig.httpUrl   = (v.querySelector('#syncHttpUrl')||{}).value || '';
      syncConfig.httpToken = (v.querySelector('#syncHttpToken')||{}).value || '';
    } else if(syncConfig.backend === 'gist'){
      syncConfig.gistToken    = (v.querySelector('#syncGistToken')||{}).value || '';
      syncConfig.gistId       = (v.querySelector('#syncGistId')||{}).value || '';
      syncConfig.gistFilename = (v.querySelector('#syncGistFn')||{}).value || 'firewise-backup.json';
    }
    saveSyncConfig();
  };

  // Persistance live des champs
  wrap.addEventListener('input', () => readFields());
  wrap.addEventListener('change', () => readFields());

  // Sélecteur de backend
  wrap.querySelectorAll('[data-be]').forEach(btn => {
    btn.onclick = () => {
      readFields();
      syncConfig.backend = btn.dataset.be;
      saveSyncConfig();
      refreshSyncPanel(v);
    };
  });

  // Révélation conditionnelle
  const toggleReveal = () => {
    const enc = v.querySelector('#syncEnc');
    const auto = v.querySelector('#syncAuto');
    if(enc) v.querySelector('#syncPassFld').style.display = enc.checked ? '' : 'none';
    if(auto) v.querySelector('#syncDelayFld').style.display = auto.checked ? '' : 'none';
  };
  const enc = v.querySelector('#syncEnc');   if(enc) enc.onchange = toggleReveal;
  const auto = v.querySelector('#syncAuto'); if(auto) auto.onchange = toggleReveal;

  // Actions
  const runAsync = async (btn, fn) => {
    readFields();
    const orig = btn.textContent;
    btn.disabled = true; btn.textContent = '…';
    try{ await fn(); }
    finally{ btn.disabled = false; btn.textContent = orig; }
  };

  wrap.querySelector('#syncTest').onclick = (ev) => runAsync(ev.currentTarget, async () => {
    try{
      const m = await syncTest();
      syncConfig.lastError = ''; saveSyncConfig();
      toast(m, true);
      refreshSyncPanel(v);
    }catch(e){
      syncConfig.lastError = e.message || String(e); saveSyncConfig();
      toast('Test échoué : ' + (e.message||e));
      refreshSyncPanel(v);
    }
  });

  wrap.querySelector('#syncPush').onclick = (ev) => runAsync(ev.currentTarget, async () => {
    try{
      await syncPush(false);
      toast('Sauvegarde poussée vers le cloud.', true);
      refreshSyncPanel(v);
    }catch(e){
      if(e.conflict){
        confirmBox('Conflit de synchronisation',
          (e.message||'') + '<br><br><b>Écraser le distant</b> avec les données locales ?',
          async () => {
            try{
              await syncPush(true);
              toast('Sauvegarde poussée (écrasement forcé).', true);
              refreshSyncPanel(v);
            }catch(e2){
              syncConfig.lastError = e2.message || String(e2); saveSyncConfig();
              toast('Push échoué : ' + (e2.message||e2));
              refreshSyncPanel(v);
            }
          });
      }else{
        syncConfig.lastError = e.message || String(e); saveSyncConfig();
        toast('Push échoué : ' + (e.message||e));
        refreshSyncPanel(v);
      }
    }
  });

  wrap.querySelector('#syncPull').onclick = (ev) => {
    confirmBox('Tirer la sauvegarde',
      'Remplacer les données locales par celles du cloud ? Les modifications locales non synchronisées seront perdues.',
      async () => {
        await runAsync(ev.currentTarget, async () => {
          try{
            await syncPull();
            toast('Sauvegarde tirée depuis le cloud.', true);
            render(); // recharge toutes les vues (l'état a changé)
          }catch(e){
            syncConfig.lastError = e.message || String(e); saveSyncConfig();
            toast('Pull échoué : ' + (e.message||e));
            refreshSyncPanel(v);
          }
        });
      });
  };
}

function refreshSyncPanel(v){
  const old = v.querySelector('#syncPanel');
  if(!old) return;
  old.outerHTML = renderSyncPanelHTML();
  bindSyncPanel(v);
}

// Chargement initial de la config sync (avant le démarrage de l'app)
loadSync();

/* ===== FIN DE sync.js ===== */

</script>
