<!-- =========================================================
     FIREWISE EQUIPMENT CARE v1.1 — VERSION AUTONOME MONO-FICHIER
     style.css + 9 fichiers .js inline dans un seul index.html
     Fonctionne via file:// (double-clic) sans serveur ni fichiers adjacents.
     Les CDN (signature_pad, html2pdf, docx) restent externes (defer, optionnels).
     ========================================================= -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#202226">
<title>Firewise — Equipment Care</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%23c1272d'/><path d='M12 3.2c2.6 3.1 4.4 5.4 4.4 8A5 5 0 0 1 7.6 12c0-1.2.35-2.3 1.05-3.4.45 1.05 1.15 1.75 2.1 2.1-.3-2.9.4-5.2 3.25-7.5z' fill='white'/></svg>">
<style>
/* =====================================================================
   FIREWISE EQUIPMENT CARE — style.css  (v2 — UI épurée & structurée)
   Refonte : palette adoucie, hiérarchie typographique claire, cartes
   légères, sections de formulaire repliables (accordéon), respiration.
===================================================================== */

/* ============ 1. FONDATIONS ============ */
:root{
  /* Surfaces & encres */
  --bg:#f6f7f9;          --bg-2:#eef0f3;     --panel:#ffffff;
  --line:#e4e7eb;        --line-2:#d6dae0;   --line-3:#b8bec6;
  --ink:#16181d;         --ink-2:#4b515a;    --ink-3:#8a909a;
  --ink-4:#b6bbc2;

  /* Accent Firewise (rouge) */
  --accent:#c1272d;      --accent-dk:#9c1f24; --accent-soft:#fbecec;

  /* États */
  --ok:#1f9d5d;          --ok-soft:#e7f6ee;
  --warn:#b8730a;         --warn-soft:#fbf2e3;
  --bad:#c1272d;         --bad-soft:#fbecec;

  /* Sidebar sombre */
  --side:#1a1c20;        --side-2:#24272d;   --side-3:#2e323a;   --side-ink:#d9dde3;

  /* Métriques */
  --radius:8px;          --radius-sm:5px;
  --shadow-1:0 1px 2px rgba(20,24,32,.04), 0 1px 3px rgba(20,24,32,.06);
  --shadow-2:0 4px 14px rgba(20,24,32,.10);
  --shadow-modal:0 18px 48px rgba(16,18,22,.22);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button{font:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
::selection{background:var(--accent-soft)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line-3);border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--ink-4)}
::-webkit-scrollbar-track{background:transparent}

/* ============ 2. COQUILLE ============ */
#app{display:flex;min-height:100vh}
#sidebar{
  width:248px;flex:0 0 248px;background:var(--side);color:var(--side-ink);
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;
}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 18px;border-bottom:1px solid var(--side-3)}
.brand-mark{
  width:34px;height:34px;background:linear-gradient(135deg,var(--accent),var(--accent-dk));
  border-radius:7px;display:flex;align-items:center;justify-content:center;flex:0 0 34px;
  box-shadow:0 2px 6px rgba(193,39,45,.35);
}
.brand-mark svg{width:20px;height:20px;fill:#fff}
.brand-txt b{display:block;font-size:14.5px;letter-spacing:.04em;color:#fff;font-weight:700}
.brand-txt span{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7a8089;margin-top:1px}
nav{padding:14px 0;flex:1;overflow-y:auto}
.nav-section-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6a7079;padding:6px 18px 4px}
.nav-item{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;
  padding:10px 18px;border-left:3px solid transparent;color:#c3c7cd;font-size:13.5px;font-weight:500;
  transition:background .15s,color .15s;
}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 17px;opacity:.85}
.nav-item:hover{background:var(--side-2);color:#fff}
.nav-item.active{border-left-color:var(--accent);background:var(--side-2);color:#fff;font-weight:600}
.nav-item.active svg{opacity:1}
.nav-count{
  margin-left:auto;font-size:11px;font-weight:600;background:var(--side-3);color:var(--side-ink);
  border-radius:10px;padding:1px 8px;line-height:1.5;min-width:20px;text-align:center;
}
.nav-item.active .nav-count{background:var(--accent);color:#fff}
.side-foot{padding:16px 18px;border-top:1px solid var(--side-3);font-size:11px;color:#6a7079;line-height:1.7}
.side-foot b{color:var(--side-ink);font-weight:600}

#content{flex:1;min-width:0;padding:32px 36px 72px;max-width:100%}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px;flex-wrap:wrap}
.view-head h1{font-size:21px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.view-head .sub{font-size:13px;color:var(--ink-3);margin-top:4px}
.view-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ============ 3. COMPOSANTS ============ */
/* Boutons */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;font-size:13px;font-weight:500;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius);color:var(--ink);
  transition:background .15s,border-color .15s,box-shadow .15s,transform .08s;
}
.btn:hover{background:var(--bg-2);border-color:var(--line-3)}
.btn:active{transform:translateY(.5px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(193,39,45,.25)}
.btn.primary:hover{background:var(--accent-dk);border-color:var(--accent-dk)}
.btn.danger{color:var(--accent);border-color:#e0bcbf;background:var(--panel)}
.btn.danger:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{font-size:12px;font-weight:500;padding:4px 9px;border:1px solid var(--line-2);border-radius:var(--radius-sm);background:var(--panel);color:var(--ink-2);transition:background .15s,border-color .15s,color .15s}
.mini:hover{border-color:var(--line-3);color:var(--ink);background:var(--bg-2)}
.mini.del{color:var(--accent)}
.mini.del:hover{background:var(--accent-soft);border-color:var(--accent)}

/* Badges */
.badge{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border:1px solid;border-radius:20px;background:var(--panel);white-space:nowrap;letter-spacing:.01em}
.badge.ok{color:var(--ok);border-color:var(--ok-soft);background:var(--ok-soft)}
.badge.warn{color:var(--warn);border-color:var(--warn-soft);background:var(--warn-soft)}
.badge.bad{color:var(--bad);border-color:var(--bad-soft);background:var(--bad-soft)}

/* Tableaux */
.tblwrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-1);overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:680px}
.tbl th{
  text-align:left;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-2);background:var(--bg-2);padding:11px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap;
}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover{background:var(--bg-2)}
.tbl .mono{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--ink-2)}
.tbl .no{font-weight:600;color:var(--accent);white-space:nowrap;cursor:pointer}
.tbl .no:hover{text-decoration:underline}
.tbl .dim{color:var(--ink-3);font-size:12.5px;margin-top:2px}

/* Champs de formulaire */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.field input,.field select,.field textarea{
  border:1px solid var(--line-2);border-radius:var(--radius);padding:9px 12px;background:var(--panel);width:100%;
  transition:border-color .15s,box-shadow .15s,background .15s;color:var(--ink);
}
.field textarea{resize:vertical;min-height:72px;line-height:1.5}
.field input::placeholder,.field textarea::placeholder{color:var(--ink-4)}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);
}
.field input.err,.field select.err,.field textarea.err{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 0 0 3px var(--bad-soft)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px}
.fgrid .full{grid-column:1/-1}

/* Accordéon de sections (formulaires structurés) */
.accordion{display:flex;flex-direction:column;gap:10px;margin-bottom:4px}
.acc-sec{
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);overflow:hidden;
  transition:border-color .15s,box-shadow .15s;
}
.acc-sec.open{border-color:var(--line-2);box-shadow:var(--shadow-1)}
.acc-sec.disabled{opacity:.55;background:var(--bg-2)}
.acc-head{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 16px;background:var(--panel);border:none;color:var(--ink);
  transition:background .15s;
}
.acc-head:hover{background:var(--bg-2)}
.acc-sec.disabled .acc-head{cursor:not-allowed}
.acc-ico{
  width:24px;height:24px;border-radius:6px;background:var(--bg-2);color:var(--ink-2);
  display:flex;align-items:center;justify-content:center;flex:0 0 24px;font-size:13px;font-weight:700;
  transition:background .15s,color .15s;
}
.acc-sec.open .acc-ico{background:var(--accent);color:#fff}
.acc-title{flex:1;font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-.005em}
.acc-sub{font-size:11.5px;color:var(--ink-3);font-weight:400}
.acc-chev{width:16px;height:16px;color:var(--ink-3);transition:transform .22s var(--ease);flex:0 0 16px}
.acc-sec.open .acc-chev{transform:rotate(90deg)}
.acc-body{display:none;padding:4px 16px 18px;border-top:1px solid var(--line);animation:accIn .22s var(--ease)}
.acc-sec.open .acc-body{display:block}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.acc-body .field:first-child{margin-top:14px}

/* Ancien fieldset conservé pour compat (sites/réglages) */
fieldset.fs{border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 16px;background:var(--panel)}
fieldset.fs legend{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:0 6px}

.hint{font-size:12px;color:var(--ink-3);line-height:1.55}
.hint b{color:var(--ink-2);font-weight:600}

/* Bande de statistiques */
.statline{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow-1);overflow-x:auto}
.stat{flex:1;min-width:130px;padding:16px 20px;border-right:1px solid var(--line);position:relative}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.stat span{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin-top:4px;display:block}
.stat.hl b{color:var(--accent)}

.dash-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;align-items:start}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);overflow:hidden}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:11.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.panel-h .panel-h-action{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
.panel-h .panel-h-action:hover{text-decoration:underline}
.panel-b{padding:8px 18px 16px}

.line-row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.line-row:last-child{border-bottom:none}
.line-row .grow{min-width:0}
.line-row .t1{font-weight:600;font-size:13px}
.line-row .t2{font-size:12px;color:var(--ink-3);margin-top:2px}
.line-row .r{margin-left:auto;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}

.hbar{display:grid;grid-template-columns:155px 1fr 36px;align-items:center;gap:11px;padding:6px 0;font-size:12.5px}
.hbar .lab{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:9px;background:var(--bg-2);border-radius:5px;overflow:hidden}
.hbar .fill{height:100%;border-radius:5px;background:var(--ink-4);transition:width .3s var(--ease)}
.hbar .fill.ok{background:var(--ok)} .hbar .fill.warn{background:var(--warn)} .hbar .fill.bad{background:var(--accent)}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}

/* Registre : maître-détail */
.reg{display:grid;grid-template-columns:272px 1fr;gap:22px;align-items:start}
.reg-side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-1);overflow:hidden;position:sticky;top:32px}
.site-item{display:block;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent;transition:background .12s}
.site-item:hover{background:var(--bg-2)}
.site-item.active{border-left-color:var(--accent);background:var(--accent-soft)}
.site-item .t1{font-weight:600;font-size:13.5px}
.site-item .t2{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.bld-list{padding:7px 0;background:var(--bg-2)}
.bld-list .cap{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding:9px 16px 5px;font-weight:600}
.bld-item{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:8px 16px 8px 24px;font-size:13px;color:var(--ink-2);transition:background .12s,color .12s}
.bld-item:hover{color:var(--ink);background:var(--panel)}
.bld-item.active{color:var(--ink);font-weight:600;background:var(--panel)}
.bld-item .n{font-size:11.5px;color:var(--ink-3);background:var(--panel);border-radius:10px;padding:1px 8px}
.site-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.site-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em}
.site-head .meta{font-size:12.5px;color:var(--ink-2);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;border:1px solid var(--line-2);border-radius:20px;padding:4px 10px;background:var(--panel);color:var(--ink-2);font-weight:500}
.chip button{color:var(--ink-3);font-size:13px;line-height:1}
.chip button:hover{color:var(--accent)}
.toolbar{display:flex;gap:9px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar input[type=search]{
  border:1px solid var(--line-2);border-radius:var(--radius);padding:8px 12px;background:var(--panel);width:240px;
  transition:border-color .15s,box-shadow .15s;
}
.toolbar input[type=search]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar select{padding:8px 12px;border:1px solid var(--line-2);border-radius:var(--radius);background:var(--panel);font-size:13px}

/* Cartes matérielles (grille registre) */
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.eq-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-1);transition:box-shadow .15s,border-color .15s;cursor:pointer}
.eq-card:hover{box-shadow:var(--shadow-2);border-color:var(--line-3)}
.eq-card .eq-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.eq-card .eq-name{font-weight:600;font-size:13.5px;line-height:1.35}
.eq-card .eq-meta{font-size:12px;color:var(--ink-3);margin-top:3px;line-height:1.4}
.eq-card .eq-sn{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-2);background:var(--bg-2);padding:2px 7px;border-radius:4px;display:inline-block;margin-top:6px}
.eq-card .eq-ph{width:100%;height:120px;object-fit:cover;border-radius:var(--radius-sm);margin-top:10px;background:var(--bg-2);border:1px solid var(--line)}

/* États vides */
.empty{padding:54px 20px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font-size:15px;color:var(--ink);margin-bottom:8px;font-weight:600}
.empty p{font-size:13px;color:var(--ink-3);margin-bottom:16px;max-width:340px;margin-left:auto;margin-right:auto}
.empty svg{width:40px;height:40px;color:var(--ink-4);margin-bottom:12px;stroke:currentColor;fill:none;stroke-width:1.4}

/* ============ 4. MODALES & TOASTS ============ */
#overlay{position:fixed;inset:0;background:rgba(20,22,28,.55);backdrop-filter:blur(2px);display:none;z-index:50;padding:24px;overflow-y:auto}
#overlay.open{display:flex;align-items:flex-start;justify-content:center}
.modal{background:var(--panel);border:1px solid var(--line-2);border-radius:12px;width:100%;max-width:680px;margin:auto;box-shadow:var(--shadow-modal);animation:modalIn .22s var(--ease)}
.modal.wide{max-width:920px}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);border-radius:12px 12px 0 0;z-index:2}
.modal-h h3{font-size:15px;font-weight:700;letter-spacing:-.01em}
.modal-h .modal-h-sub{font-size:12px;color:var(--ink-3);margin-top:2px;font-weight:400}
.modal-x{font-size:22px;line-height:1;color:var(--ink-3);padding:4px 8px;border-radius:6px;transition:background .12s,color .12s}
.modal-x:hover{color:var(--ink);background:var(--bg-2)}
.modal-b{padding:20px;max-height:calc(100vh - 180px);overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:9px;padding:14px 20px;border-top:1px solid var(--line);background:var(--bg-2);border-radius:0 0 12px 12px;position:sticky;bottom:0}

#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:9px}
.toast{
  background:#23262c;color:#f0efed;font-size:13px;padding:11px 16px;border-radius:var(--radius);
  border-left:3px solid var(--accent);max-width:360px;box-shadow:0 8px 22px rgba(0,0,0,.28);
  animation:tin .22s var(--ease);font-weight:500;
}
.toast.ok{border-left-color:var(--ok)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ 5. FEUILLE DE RAPPORT ============ */
.report-sheet{background:#fff;border:1px solid var(--line-2);border-radius:var(--radius);max-width:840px;margin:0 auto;padding:34px 38px;box-shadow:var(--shadow-1)}
.rp{color:#111;font-size:12.5px;line-height:1.55}
.rp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #111;padding-bottom:13px;margin-bottom:16px}
.rp-brand{font-size:11px;font-weight:700;letter-spacing:.12em}
.rp-brand .rp-mark{display:inline-block;width:11px;height:11px;background:#c1272d;margin-right:7px;vertical-align:-1px;border-radius:2px}
.rp-doc{text-align:right}
.rp-title{font-size:18px;font-weight:750;letter-spacing:.03em}
.rp-type{font-size:11px;color:#666;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.rp-no{font-size:12.5px;color:#c1272d;font-weight:700;margin-top:3px;font-variant-numeric:tabular-nums}
table.rp-meta{width:100%;border-collapse:collapse;margin-bottom:18px}
.rp-meta th,.rp-meta td{border:1px solid #333;padding:7px 10px;text-align:left;font-size:12px}
.rp-meta th{background:#efeceb;font-weight:600;width:115px;letter-spacing:.03em}
.rp-sec{margin-bottom:15px}
.rp-sec h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid #333;padding-bottom:5px;margin-bottom:8px;color:#333;font-weight:700}

function esc(s){
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = String(iso).split('T')[0].split('-');
  return d ? `${d}/${m}/${y}` : iso;
}
function slug(s){
  return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'').toLowerCase();
}

function toast(msg, ok){
  const t = document.createElement('div');

  t.textContent = msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(() => t.remove(), 3800);
}

// Réduit une photo (caméra ou galerie) pour le stockage local : max 900px, JPEG
function compressImage(file, maxSide, quality){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  ctx.fillStyle = '#2b2e33'; ctx.fillRect(0, 0, 520, 190);
  ctx.strokeStyle = '#8f9296'; ctx.lineWidth = 3; ctx.strokeRect(8, 8, 504, 174);
  ctx.fillStyle = '#c1272d'; ctx.fillRect(444, 24, 48, 48);
  lines.forEach((l, i) => {
    ctx.font = i === 0 ? 'bold 30px system-ui, sans-serif' : '20px system-ui, sans-serif';
    ctx.fillStyle = i === 0 ? '#ffffff' : '#b9bbbe';

// Catalogue marques/références : alimenté automatiquement à chaque
// enregistrement de matériel, puis proposé dans les formulaires suivants
function addToCatalog(brand, model){
  const b = String(brand || '').trim();
  if(!b) return;
  let entry = state.catalog.find(c => String(c.b).toLowerCase() === b.toLowerCase());
  if(!entry){ entry = { b, refs: [] }; state.catalog.push(entry); }
  else entry.b = b; // conserve la casse la plus récente
  const m = String(model || '').trim();
  if(m && !entry.refs.some(r => String(r).toLowerCase() === m.toLowerCase())) entry.refs.push(m);
}

/* ---------- 4. Jeu de démonstration (premier lancement) ---------- */
function fakeSig(name){
  const cv = document.createElement('canvas');
  cv.width = 420; cv.height = 130;
  const ctx = cv.getContext('2d');
  ctx.strokeStyle = '#1e2022'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  let seed = 0; for(const c of name) seed += c.charCodeAt(0);
  ctx.beginPath();
  for(let x = 30; x <= 390; x += 4){
    const y = 65 + Math.sin(x/26 + seed) * 16 + Math.sin(x/9 + seed*1.7) * 6;
    x === 30 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(50, 92); ctx.bezierCurveTo(120, 60, 200, 118, 300, 78);
  ctx.stroke();
  return cv.toDataURL('image/png');
}

const overlay = document.getElementById('overlay');
const modalBox = document.getElementById('modalBox');

function openModal(title, bodyHTML, wide){
  modalBox.className = 'modal' + (wide ? ' wide' : '');
  modalBox.innerHTML = `
    <div class="modal-h"><h3>${esc(title)}</h3><button class="modal-x" id="mClose" title="Fermer">×</button></div>
    <div class="modal-b">${bodyHTML}</div>`;
  overlay.classList.add('open');
  document.getElementById('mClose').onclick = closeModal;
  return modalBox.querySelector('.modal-b');
}
function closeModal(){ overlay.classList.remove('open'); modalBox.innerHTML = ''; }
overlay.addEventListener('mousedown', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && overlay.classList.contains('open')) closeModal(); });

function confirmBox(title, msg, onOk){
  const body = openModal(title, `
    <p style="line-height:1.6;color:var(--ink-2)">${msg}</p>`);
  const foot = document.createElement('div');
  foot.className = 'modal-f';
  foot.innerHTML = `<button class="btn" id="cNo">Annuler</button><button class="btn primary" id="cYes">Confirmer</button>`;
  modalBox.appendChild(foot);
  foot.querySelector('#cNo').onclick = closeModal;
  foot.querySelector('#cYes').onclick = () => { closeModal(); onOk(); };
}

function formFooter(submitLabel){
  const foot = document.createElement('div');
  foot.className = 'modal-f';
  foot.innerHTML = `<button class="btn" id="fCancel">Annuler</button><button class="btn primary" id="fSubmit">${esc(submitLabel)}</button>`;
  modalBox.appendChild(foot);
  foot.querySelector('#fCancel').onclick = closeModal;
  return foot.querySelector('#fSubmit');
}
function markInvalid(el){ if(el){ el.classList.add('err'); el.focus(); } }

  ['dashboard','Registre général','<rect x="2.5" y="3.5" width="11" height="9" rx="1"/><path d="M2.5 7h11M6.5 7v5.5"/>'],
  ['registry','Sites & matériel','<path d="M4 13V4h8v9M2.5 13h11M6 6.5h1.5M9 6.5h1.5M6 9h1.5M9 9h1.5M7.5 13v-2h1v2"/>'],
  ['reports','Rapports','<path d="M5 2.5h6l2.5 2.5v8.5H5zM11 2.5V5h2.5M7 7.5h4M7 10h4"/>'],
  ['settings','Réglages','<path d="M3 5h10M3 10.5h10"/><circle cx="7" cy="5" r="1.7"/><circle cx="10" cy="10.5" r="1.7"/>'],
];

function renderNav(){
  const cur = ui.view === 'report' ? 'reports' : ui.view;
  document.getElementById('nav').innerHTML = NAV.map(([id,label,icon]) => `
    <button class="nav-item ${cur===id?'active':''}" data-nav="${id}">
      <svg viewBox="0 0 16 16">${icon}</svg>${label}
      ${id==='reports' && state.reports.length ? `<span class="nav-count">${state.reports.length}</span>` : ''}
    </button>`).join('');
  document.getElementById('nav').querySelectorAll('[data-nav]').forEach(b => {
    b.onclick = () => go(b.dataset.nav);
  });
}

function go(view, opts = {}){
  ui.view = view;
  if('siteId' in opts) ui.siteId = opts.siteId;
  if('buildingId' in opts) ui.buildingId = opts.buildingId;
  if('reportId' in opts) ui.reportId = opts.reportId;
  render();
}

function render(){
  renderNav();
  const v = document.getElementById('view');
  if(ui.view === 'dashboard') renderDashboard(v);
  else if(ui.view === 'registry') renderRegistry(v);
  else if(ui.view === 'reports') renderReports(v);
  else if(ui.view === 'report') renderReportDetail(v);
  else if(ui.view === 'settings') renderSettings(v);
}

/* ---------- 7. Vue : Tableau de bord ---------- */
function renderDashboard(v){
  const hs = state.equipment.filter(e => e.status === 'hs');
  const byType = {};
  state.equipment.forEach(e => { const l = typeLabel(e.type); byType[l] = (byType[l]||0)+1; });
  const typeRows = Object.entries(byType).sort((a,b) => b[1]-a[1]).slice(0,6);
  const stCounts = { service:0, verif:0, hs:0 };
  state.equipment.forEach(e => stCounts[e.status] = (stCounts[e.status]||0)+1);
  const lastReports = [...state.reports].sort((a,b) => (b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0)).slice(0,6);
  const maxT = typeRows.length ? typeRows[0][1] : 1;

  const hasData = state.sites.length || state.reports.length;
  v.innerHTML = `
    <div class="view-head">
      <div><h1>Registre général</h1><div class="sub">Vue du ${fmtDate(todayISO())} — parc SSI et interventions récentes</div></div>
      <div class="view-actions">
        ${state.sites.length ? `<button class="btn" id="dashEq">Ajouter du matériel</button>` : ''}
        <button class="btn primary" id="dashRep">Nouveau rapport</button>
      </div>
    </div>
    ${!hasData ? `
      <div class="panel"><div class="empty">
        <b>Bienvenue dans Firewise Equipment Care</b>
        <p>Commencez par créer votre premier site, puis ajoutez vos bâtiments et le matériel SSI associé.<br>Un jeu de démonstration est également disponible dans les Réglages.</p>
        <button class="btn primary" id="dashSite">Créer un premier site</button>
      </div></div>` : `
    <div class="statline">
      <div class="stat"><b>${state.sites.length}</b><span>Sites</span></div>
      <div class="stat"><b>${state.buildings.length}</b><span>Bâtiments</span></div>
      <div class="stat"><b>${state.equipment.length}</b><span>Matériel SSI</span></div>
      <div class="stat hl"><b>${hs.length}</b><span>Hors service</span></div>
      <div class="stat"><b>${state.reports.length}</b><span>Rapports</span></div>
    </div>
    <div class="dash-grid">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel">
          <div class="panel-h"><h2>Derniers rapports</h2><button class="mini" id="dashAll">Tout voir</button></div>
          <div class="panel-b">
            ${lastReports.length ? lastReports.map(r => `
              <div class="line-row">
                <div class="grow">
                  <div class="t1"><span style="color:var(--accent);font-weight:650">${esc(r.no)}</span> — ${esc(REPORT_TYPES[r.type]||'')}</div>
                  <div class="t2">${esc(r.siteName||'')}${r.equipmentDesc ? ' · ' + esc(r.equipmentDesc) : ''}</div>
                </div>
                <div class="r"><div class="t1" style="font-size:13px">${fmtDate(r.date)}</div><button class="mini" data-open-r="${r.id}">Ouvrir</button></div>
              </div>`).join('') : `<div class="empty" style="padding:20px"><p>Aucun rapport enregistré pour le moment.</p></div>`}
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>Matériel hors service</h2></div>
          <div class="panel-b">
            ${hs.length ? hs.map(e => {
              const s = state.sites.find(x => x.id === e.siteId), b = state.buildings.find(x => x.id === e.buildingId);
              return `<div class="line-row">
                <div class="grow"><div class="t1">${esc(typeLabel(e.type))} <span style="color:var(--ink-3);font-weight:400">— ${esc(e.brand||'')} ${esc(e.model||'')}</span></div>
                <div class="t2">${esc(s ? s.name : '')} · ${esc(b ? b.name : '')} · ${esc(e.loc||'')}</div></div>
                <button class="mini" data-goto-reg="${e.siteId}">Voir</button>
              </div>`;}).join('') : `<div class="empty" style="padding:20px"><p>Aucun matériel hors service.</p></div>`}
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel">
          <div class="panel-h"><h2>Répartition par état</h2></div>
          <div class="panel-b" style="padding-top:10px">
            ${['service','verif','hs'].map(s => `
              <div class="hbar"><span class="lab">${STATUS[s]}</span>
                <div class="track"><div class="fill ${s==='service'?'ok':s==='verif'?'warn':'bad'}" style="width:${state.equipment.length ? Math.round(stCounts[s]/state.equipment.length*100) : 0}%"></div></div>
                <span class="n">${stCounts[s]||0}</span></div>`).join('')}
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>Par type de matériel</h2></div>
          <div class="panel-b" style="padding-top:10px">
            ${typeRows.length ? typeRows.map(([l,n]) => `
              <div class="hbar"><span class="lab" title="${esc(l)}">${esc(l)}</span>
                <div class="track"><div class="fill" style="width:${Math.round(n/maxT*100)}%"></div></div>
                <span class="n">${n}</span></div>`).join('') : `<div class="empty" style="padding:16px"><p>Aucun matériel enregistré.</p></div>`}
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>Dernier matériel ajouté</h2></div>
          <div class="panel-b">
            ${[...state.equipment].slice(-4).reverse().map(e => `
              <div class="line-row"><div class="grow"><div class="t1">${esc(typeLabel(e.type))}</div>
              <div class="t2">${esc(e.brand||'')} ${esc(e.model||'')} · ${esc(e.loc||'—')}</div></div>${statusBadge(e.status)}</div>`).join('')
              || `<div class="empty" style="padding:16px"><p>—</p></div>`}
          </div>
        </div>
      </div>
    </div>`}
  `;
  const bind = (id, fn) => { const el = v.querySelector(id); if(el) el.onclick = fn; };
  bind('#dashRep', () => openReportForm());
  bind('#dashSite', () => openSiteForm());
  bind('#dashEq', () => openEquipmentForm());
  bind('#dashAll', () => go('reports'));
  v.querySelectorAll('[data-open-r]').forEach(b => b.onclick = () => go('report', { reportId:b.dataset.openR }));
  v.querySelectorAll('[data-goto-reg]').forEach(b => b.onclick = () => go('registry', { siteId:b.dataset.gotoReg, buildingId:null }));
}

/* ===== FIN DE views.js ===== */
</script>
<script data-src="registry.js">
/* =====================================================================
   FIREWISE EQUIPMENT CARE — registry.js
   Vue registre (maître-détail) : sites > bâtiments > matériel
===================================================================== */

/* ---------- 8. Vue : Registre (maître-détail) ---------- */
function renderRegistry(v){
  const sites = state.sites;
  if(!sites.length){
    v.innerHTML = `
      <div class="view-head"><div><h1>Sites & matériel</h1><div class="sub">Aucun site enregistré</div></div>
      <div class="view-actions"><button class="btn primary" id="regAddSite">Nouveau site</button></div></div>
      <div class="panel"><div class="empty"><b>Aucun site</b><p>Créez un site pour y rattacher vos bâtiments et votre matériel SSI.</p></div></div>`;
    v.querySelector('#regAddSite').onclick = () => openSiteForm();
    return;
  }
  if(!state.sites.find(s => s.id === ui.siteId)){ ui.siteId = sites[0].id; ui.buildingId = null; }
  const site = sites.find(s => s.id === ui.siteId);
  const blds = state.buildings.filter(b => b.siteId === site.id);
  if(ui.buildingId && !blds.find(b => b.id === ui.buildingId)) ui.buildingId = null;

  let eq = state.equipment.filter(e => e.siteId === site.id);
  if(ui.buildingId) eq = eq.filter(e => e.buildingId === ui.buildingId);
  const q = ui.q.trim().toLowerCase();
  if(q) eq = eq.filter(e => [typeLabel(e.type), e.brand, e.model, e.serial, e.loc]
    .some(x => String(x||'').toLowerCase().includes(q)));

  const siteBld = b => state.buildings.find(x => x.id === b.buildingId);

  v.innerHTML = `
    <div class="view-head">
      <div><h1>Sites & matériel</h1><div class="sub">${state.sites.length} site(s) · ${state.equipment.length} matériel(s) SSI · ${state.catalog.length} marque(s) au catalogue</div></div>
      <div class="view-actions"><button class="btn" id="regAddSite">Nouveau site</button><button class="btn primary" id="regAddEq">Ajouter du matériel</button></div>
    </div>
    <div class="reg">
      <div class="reg-side">
        ${sites.map(s => `
          <button class="site-item ${s.id===site.id?'active':''}" data-sel-site="${s.id}">
            <div class="t1">${esc(s.name)}</div>
            <div class="t2">${esc(s.city||'')} · ${state.buildings.filter(b=>b.siteId===s.id).length} bât. · ${state.equipment.filter(e=>e.siteId===s.id).length} matériel(s)</div>
          </button>`).join('')}
        ${blds.length ? `<div class="bld-list"><div class="cap">Bâtiments — ${esc(site.name)}</div>
          <button class="bld-item ${!ui.buildingId?'active':''}" data-sel-bld=""><span>Tout le site</span><span class="n">${state.equipment.filter(e=>e.siteId===site.id).length}</span></button>
          ${blds.map(b => `
            <button class="bld-item ${ui.buildingId===b.id?'active':''}" data-sel-bld="${b.id}">
              <span>${esc(b.name)}</span><span class="n">${state.equipment.filter(e=>e.buildingId===b.id).length}</span>
            </button>`).join('')}
        </div>` : ''}
      </div>
      <div>
        <div class="site-head">
          <div>
            <h2>${esc(site.name)}</h2>
            <div class="meta">${esc([site.address, [site.zip, site.city].filter(Boolean).join(' ')].filter(Boolean).join(', ') || 'Adresse non renseignée')}
            ${site.contact ? ` · Contact : ${esc(site.contact)}${site.phone ? ' (' + esc(site.phone) + ')' : ''}` : ''}</div>
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn" id="regEditSite">Modifier</button>
            <button class="btn" id="regAddBld">+ Bâtiment</button>
            <button class="btn danger" id="regDelSite">Supprimer</button>
          </div>
        </div>
        <div class="toolbar">
          ${ui.buildingId ? `<span class="chip">Bâtiment : ${esc((blds.find(b=>b.id===ui.buildingId)||{}).name||'')}<button id="chipClear" title="Retirer le filtre">×</button></span>` : ''}
          <input type="search" id="regQ" placeholder="Rechercher (type, marque, n° série…)" value="${esc(ui.q)}">
        </div>
        <div class="tblwrap"><table class="tbl">
          <thead><tr><th style="width:52px">Ph.</th><th>Type</th><th>Désignation</th><th>N° série</th><th>Localisation</th><th>Bâtiment</th><th>M.E.S.</th><th>État</th><th style="width:120px"></th></tr></thead>
          <tbody>
            ${eq.length ? eq.map(e => `
              <tr>
                <td>${e.photo
                  ? `<img src="${e.photo}" alt="" style="width:38px;height:29px;object-fit:cover;border-radius:3px;border:1px solid var(--line-2);display:block">`
                  : '<span class="dim">—</span>'}</td>
                <td>${esc(typeLabel(e.type))}</td>
                <td><b>${esc(e.brand||'—')}</b><div class="dim">${esc(e.model||'')}</div></td>
                <td class="mono">${esc(e.serial||'—')}</td>
                <td>${esc(e.loc||'—')}</td>
                <td class="dim">${esc((siteBld(e)||{}).name||'—')}</td>
                <td class="mono">${fmtDate(e.mes)}</td>
                <td>${statusBadge(e.status)}</td>
                <td><div style="display:flex;gap:6px;justify-content:flex-end">
                  <button class="mini" data-edit-eq="${e.id}">Modifier</button>
                  <button class="mini del" data-del-eq="${e.id}">Suppr.</button>
                </div></td>
              </tr>`).join('')
            : `<tr><td colspan="9"><div class="empty" style="padding:26px"><b>Aucun matériel${q||ui.buildingId ? ' ne correspond' : ''}</b><p>${q||ui.buildingId ? 'Ajustez la recherche ou le filtre de bâtiment.' : 'Ajoutez le premier équipement SSI de ce site.'}</p></div></td></tr>`}
          </tbody>
        </table></div>
      </div>
    </div>`;

  v.querySelector('#regAddSite').onclick = () => openSiteForm();
  v.querySelector('#regAddEq').onclick = () => openEquipmentForm();
  v.querySelector('#regEditSite').onclick = () => openSiteForm(site.id);
  v.querySelector('#regAddBld').onclick = () => openBuildingForm(site.id);
  v.querySelector('#regDelSite').onclick = () => {
    const n = state.buildings.filter(b => b.siteId === site.id).length + state.equipment.filter(e => e.siteId === site.id).length;
    confirmBox('Supprimer le site', `Supprimer <b>« ${esc(site.name)} »</b> ainsi que ses ${n} élément(s) rattaché(s) ?<br>Les rapports déjà créés seront conservés.`, () => {
      state.buildings = state.buildings.filter(b => b.siteId !== site.id);
      state.equipment = state.equipment.filter(e => e.siteId !== site.id);
      state.sites = state.sites.filter(s => s.id !== site.id);
      ui.siteId = null; ui.buildingId = null; save(); render();
      toast('Site supprimé.', true);
    });
  };
  const qInput = v.querySelector('#regQ');
  qInput.oninput = () => { ui.q = qInput.value; renderRegistry(v);
    const nq = v.querySelector('#regQ'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
  const chip = v.querySelector('#chipClear'); if(chip) chip.onclick = () => { ui.buildingId = null; render(); };
  v.querySelectorAll('[data-sel-site]').forEach(b => b.onclick = () => go('registry', { siteId:b.dataset.selSite, buildingId:null }));
  v.querySelectorAll('[data-sel-bld]').forEach(b => b.onclick = () => { ui.buildingId = b.dataset.selBld || null; render(); });
  v.querySelectorAll('[data-edit-eq]').forEach(b => b.onclick = () => openEquipmentForm(b.dataset.editEq));
  v.querySelectorAll('[data-del-eq]').forEach(b => b.onclick = () => {
    const e = state.equipment.find(x => x.id === b.dataset.delEq);
    confirmBox('Supprimer le matériel', `Supprimer <b>${esc(typeLabel(e.type))} — ${esc(e.brand||'')} ${esc(e.model||'')}</b> (NS ${esc(e.serial||'—')}) ?`, () => {
      state.equipment = state.equipment.filter(x => x.id !== e.id); save(); render();
      toast('Matériel supprimé.', true);
    });
  });
}

/* ===== FIN DE registry.js ===== */
</script>
<script data-src="forms.js">
/* =====================================================================
   FIREWISE EQUIPMENT CARE — forms.js
   Formulaires : site, bâtiment, matériel
   Les marques/références saisies alimentent automatiquement le
   catalogue et sont proposées dans les formulaires suivants.
===================================================================== */

/* ---------- 9. Formulaires : site / bâtiment ---------- */
function openSiteForm(siteId){
  const s = state.sites.find(x => x.id === siteId) || {};
  openModal(s.id ? 'Modifier le site' : 'Nouveau site', `
    <div class="fgrid">
      <div class="field full"><label>Nom du site *</label><input id="f_name" value="${esc(s.name||'')}"></div>
      <div class="field full"><label>Adresse</label><input id="f_addr" value="${esc(s.address||'')}"></div>
      <div class="field"><label>Code postal</label><input id="f_zip" value="${esc(s.zip||'')}"></div>
      <div class="field"><label>Ville</label><input id="f_city" value="${esc(s.city||'')}"></div>
      <div class="field"><label>Contact sur site</label><input id="f_contact" value="${esc(s.contact||'')}"></div>
      <div class="field"><label>Téléphone</label><input id="f_phone" value="${esc(s.phone||'')}"></div>
    </div>`);
  const submit = formFooter(s.id ? 'Enregistrer' : 'Créer le site');
  submit.onclick = () => {
    const name = document.getElementById('f_name').value.trim();
    if(!name){ markInvalid(document.getElementById('f_name')); return toast('Le nom du site est obligatoire.'); }
    const data = {
      name, address:document.getElementById('f_addr').value.trim(),
      zip:document.getElementById('f_zip').value.trim(), city:document.getElementById('f_city').value.trim(),
      contact:document.getElementById('f_contact').value.trim(), phone:document.getElementById('f_phone').value.trim(),
    };
    if(s.id) Object.assign(state.sites.find(x => x.id === s.id), data);
    else { const ns = { id:uid(), ...data }; state.sites.push(ns); ui.siteId = ns.id; }
    save(); closeModal(); render(); toast(s.id ? 'Site mis à jour.' : 'Site créé.', true);
  };
}

function openBuildingForm(siteId){
  const opts = state.sites.map(s => `<option value="${s.id}" ${s.id===siteId?'selected':''}>${esc(s.name)}</option>`).join('');
  openModal('Nouveau bâtiment', `
    <div class="fgrid">
      <div class="field"><label>Site *</label><select id="f_site">${opts}</select></div>
      <div class="field"><label>Nom du bâtiment *</label><input id="f_name"></div>
      <div class="field full"><label>Note (niveaux, particularités…)</label><textarea id="f_note"></textarea></div>
    </div>`);
  const submit = formFooter('Créer le bâtiment');
  submit.onclick = () => {
    const siteSel = document.getElementById('f_site').value;
    const name = document.getElementById('f_name').value.trim();
    if(!name){ markInvalid(document.getElementById('f_name')); return toast('Le nom du bâtiment est obligatoire.'); }
    state.buildings.push({ id:uid(), siteId:siteSel, name, note:document.getElementById('f_note').value.trim() });
    ui.siteId = siteSel; save(); closeModal(); render(); toast('Bâtiment créé.', true);
  };
}

/* ---------- 9b. Formulaire matériel : catalogue + photo ---------- */
function openEquipmentForm(eqId){
  const e = state.equipment.find(x => x.id === eqId) || {};
  const selSite = e.siteId || (ui.siteId && state.sites.find(s => s.id === ui.siteId) ? ui.siteId : (state.sites[0]||{}).id);
  const bldOpts = sid => state.buildings.filter(b => b.siteId === sid)
    .map(b => `<option value="${b.id}" ${b.id===e.buildingId?'selected':''}>${esc(b.name)}</option>`).join('') || '<option value="">—</option>';

  // Catalogue marques/références connues (+ celle du matériel édité si absente)
  const brands = state.catalog.map(c => ({ b:c.b, refs:[...c.refs] }));
  if(e.brand && !brands.some(c => String(c.b).toLowerCase() === String(e.brand).toLowerCase()))
    brands.unshift({ b:e.brand, refs:e.model ? [e.model] : [] });
  brands.sort((a,b) => a.b.localeCompare(b.b, 'fr'));

  let photoData = e.photo || null;

  openModal(e.id ? 'Modifier le matériel' : 'Nouveau matériel', `
    <div class="fgrid">
      <div class="field"><label>Site *</label><select id="f_site">${state.sites.map(s => `<option value="${s.id}" ${s.id===selSite?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Bâtiment *</label><select id="f_bld">${bldOpts(selSite)}</select></div>
      <div class="field"><label>Type de matériel *</label><select id="f_type">${TYPES_EQ.map(([v,l]) => `<option value="${v}" ${v===e.type?'selected':''}>${esc(l)}</option>`).join('')}</select></div>
      <div class="field"><label>État *</label><select id="f_status">${Object.entries(STATUS).map(([v,l]) => `<option value="${v}" ${v===e.status?'selected':''}>${l}</option>`).join('')}</select></div>
      <div class="field"><label>Marque</label>
        <select id="f_brandSel">
          <option value="">— choisir dans le catalogue —</option>
          ${brands.map(c => `<option value="${esc(c.b)}" ${String(c.b)===String(e.brand)?'selected':''}>${esc(c.b)}</option>`).join('')}
          <option value="__other__">＋ Autre marque (nouvelle)…</option>
        </select>
        <input id="f_brand" placeholder="Taper la nouvelle marque" style="display:none;margin-top:6px" value="${esc(e.brand||'')}">
      </div>
      <div class="field"><label>Référence / modèle</label>
        <select id="f_modelSel"></select>
        <input id="f_model" placeholder="Taper la nouvelle référence" style="display:none;margin-top:6px" value="${esc(e.model||'')}">
      </div>
      <div class="field"><label>N° de série</label><input id="f_serial" value="${esc(e.serial||'')}"></div>
      <div class="field"><label>Date de mise en service</label><input type="date" id="f_mes" value="${esc(e.mes||'')}"></div>
      <div class="field full"><label>Localisation précise</label><input id="f_loc" value="${esc(e.loc||'')}" placeholder="Ex. : local CMCF, palier R+2, salle machines…"></div>
      <div class="field full"><label>Photo d’identification (plaque signalétique, étiquette…)</label>
        <div style="display:flex;gap:12px;align-items:flex-start">
          <img id="f_photoPrev" alt="Photo d’identification" src="${photoData ? photoData : ''}"
               style="width:120px;height:90px;object-fit:cover;border:1px solid var(--line-2);border-radius:6px;background:#f2f1ef;${photoData ? '' : 'display:none'}">
          <div style="display:flex;flex-direction:column;gap:6px">
            <input type="file" id="f_photo" accept="image/*" capture="environment" style="font-size:12px">
            <button type="button" class="mini del" id="f_photoDel" ${photoData ? '' : 'style="display:none"'}>Retirer la photo</button>
            <span class="hint">La photo est réduite puis enregistrée localement avec le matériel.</span>
          </div>
        </div>
      </div>
    </div>`);

  const siteSel = modalBox.querySelector('#f_site'), bldSel = modalBox.querySelector('#f_bld');
  siteSel.onchange = () => { bldSel.innerHTML = bldOpts(siteSel.value); };

  // --- listes à choix alimentées par le catalogue ---
  const brandSel = modalBox.querySelector('#f_brandSel'), brandInput = modalBox.querySelector('#f_brand');
  const modelSel = modalBox.querySelector('#f_modelSel'), modelInput = modalBox.querySelector('#f_model');

  function syncBrandUI(){
    const other = brandSel.value === '__other__';
    brandInput.style.display = other ? '' : 'none';
    const entry = brands.find(c => c.b === brandSel.value);
    const refs = entry ? entry.refs : [];
    const cur = e.model || '';
    modelSel.innerHTML = '<option value="">— choisir dans le catalogue —</option>'
      + refs.map(rf => `<option value="${esc(rf)}" ${rf===cur?'selected':''}>${esc(rf)}</option>`).join('')
      + (cur && !refs.some(rf => rf === cur) ? `<option value="${esc(cur)}" selected>${esc(cur)}</option>` : '')
      + '<option value="__other__">＋ Autre référence (nouvelle)…</option>';
    syncModelUI();
  }
  function syncModelUI(){
    modelInput.style.display = modelSel.value === '__other__' ? '' : 'none';
  }
  brandSel.onchange = syncBrandUI;
  modelSel.onchange = syncModelUI;
  syncBrandUI();

  // --- photo d'identification ---
  const photoPrev = modalBox.querySelector('#f_photoPrev');
  const photoDel  = modalBox.querySelector('#f_photoDel');
  modalBox.querySelector('#f_photo').onchange = ev => {
    const file = ev.target.files && ev.target.files[0];
    if(!file) return;
    compressImage(file, 900, 0.75).then(d => {
      photoData = d;
      photoPrev.src = d; photoPrev.style.display = '';
      photoDel.style.display = '';
    }).catch(() => toast('Impossible de lire cette image.'));
  };
  photoDel.onclick = () => {
    photoData = null;
    photoPrev.style.display = 'none';
    photoDel.style.display = 'none';
  };

  // --- enregistrement ---
  const submit = formFooter(e.id ? 'Enregistrer' : 'Ajouter le matériel');
  submit.onclick = () => {
    if(!bldSel.value){ markInvalid(bldSel); return toast('Sélectionnez un bâtiment (créez-en un si nécessaire).'); }
    const brand = brandSel.value === '__other__' ? brandInput.value.trim() : brandSel.value;
    const model = modelSel.value === '__other__' ? modelInput.value.trim() : modelSel.value;
    const data = {
      siteId:siteSel.value, buildingId:bldSel.value,
      type:document.getElementById('f_type').value, status:document.getElementById('f_status').value,
      brand, model,
      serial:document.getElementById('f_serial').value.trim(), mes:document.getElementById('f_mes').value,
      loc:document.getElementById('f_loc').value.trim(),
      photo:photoData,
    };
    // Enregistrement automatique dans le catalogue pour les prochains formulaires
    addToCatalog(brand, model);
    if(e.id) Object.assign(state.equipment.find(x => x.id === e.id), data);
    else { const ne = { id:uid(), ...data }; state.equipment.push(ne); ui.siteId = ne.siteId; }
    save(); closeModal(); render();
    toast(e.id ? 'Matériel mis à jour — catalogue marques/références actualisé.' : 'Matériel ajouté — catalogue marques/références actualisé.', true);
  };
}

/* ===== FIN DE forms.js ===== */
</script>
<script data-src="reports.js">
/* =====================================================================
   FIREWISE EQUIPMENT CARE — reports.js

/* ---------- 10. Vue : Liste des rapports ---------- */
function renderReports(v){

      <select id="repType" class="mini" style="padding:7px 10px">

        ${Object.entries(REPORT_TYPES).map(([k,l]) => `<option value="${k}" ${ui.typeFilter===k?'selected':''}>${l}</option>`).join('')}

    </div>
    <div class="tblwrap"><table class="tbl">
      <thead><tr><th>N°</th><th>Date</th><th>Type</th><th>Objet</th><th>Technicien</th><th>Anomalies</th><th style="width:210px"></th></tr></thead>
      <tbody>
        ${list.length ? list.map(r => `
          <tr>
            <td class="no" data-open-r="${r.id}">${esc(r.no)}</td>
            <td class="mono">${fmtDate(r.date)}</td>
            <td>${esc(REPORT_TYPES[r.type]||r.type)}</td>
            <td>${esc([r.siteName, r.buildingName].filter(Boolean).join(' — ') || '—')}${r.equipmentDesc ? `<div class="dim">${esc(r.equipmentDesc)}</div>` : ''}</td>
            <td>${esc(r.tech||'—')}</td>
            <td>${(r.anomalies||'').trim() ? '<span class="badge bad">Oui</span>' : '<span class="dim">Non</span>'}</td>
            <td><div style="display:flex;gap:6px;justify-content:flex-end">
              <button class="mini" data-open-r="${r.id}">Voir</button>
              <button class="mini" data-pdf-r="${r.id}">PDF</button>
              <button class="mini" data-docx-r="${r.id}">Word</button>
              <button class="mini del" data-del-r="${r.id}">Suppr.</button>
            </div></td>
          </tr>`).join('')
        : `<tr><td colspan="7"><div class="empty" style="padding:30px"><b>Aucun rapport</b><p>${q||ui.typeFilter ? 'Aucun résultat pour ces filtres.' : 'Créez votre premier rapport d’intervention.'}</p></div></td></tr>`}
      </tbody>
    </table></div>`;

  v.querySelector('#repNew').onclick = () => openReportForm();
  const qInput = v.querySelector('#repQ');
  qInput.oninput = () => { ui.q = qInput.value; renderReports(v);
    const nq = v.querySelector('#repQ'); nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); };
  v.querySelector('#repType').onchange = e => { ui.typeFilter = e.target.value; renderReports(v); };
  v.querySelectorAll('[data-open-r]').forEach(b => b.onclick = () => go('report', { reportId:b.dataset.openR }));
  v.querySelectorAll('[data-pdf-r]').forEach(b => b.onclick = () => exportPDF(b.dataset.pdfR));
  v.querySelectorAll('[data-docx-r]').forEach(b => b.onclick = () => exportDOCX(b.dataset.docxR));
  v.querySelectorAll('[data-del-r]').forEach(b => b.onclick = () => {
    const r = state.reports.find(x => x.id === b.dataset.delR);
    confirmBox('Supprimer le rapport', `Supprimer définitivement le rapport <b>${esc(r.no)}</b> ?`, () => {
      state.reports = state.reports.filter(x => x.id !== r.id); save(); render();
      toast('Rapport supprimé.', true);
    });
  });
}

/* ---------- 12. Feuille de rapport (réutilisée à l'écran et pour l'export) ---------- */
function reportObjet(r){
  const parts = [r.siteName, r.buildingName, r.equipmentDesc].filter(Boolean);
  return parts.length ? parts.join(' — ') : '—';
}

function reportSheetHTML(r){
  const pieces = (r.pieces || []);
  const tests = (r.tests || []);
  const batteries = (r.batteries || []);
  const resColor = { conforme:'#2e7d4f', surveil:'#a86a08', nonconforme:'#c1272d', remplacer:'#c1272d' };
  const resCell = res => `<td style="color:${resColor[res]||'#333'};font-weight:${res?'600':'400'}">${esc(TEST_RESULTS[res]||BATTERY_RESULTS[res]||'—')}</td>`;
  const profile = REPORT_PROFILES[r.type] || REPORT_PROFILES.maintenance;
  const typeLabel = (REPORT_TYPES[r.type]||'') + (profile.label && profile.label !== REPORT_TYPES[r.type] ? '' : '');
  // Helper : section avec contenu (vide si non pertinent)
  const sec = (title, bodyHTML, opts = {}) => {
    if(opts.skipIfEmpty && !bodyHTML.trim()) return '';
    return `<div class="rp-sec"><h3>${title}</h3>${bodyHTML}</div>`;
  };
  const para = (txt, empty = '—') => `<p>${esc(txt) || `<span class="rp-empty">${empty}</span>`}</p>`;

  return `
  <div class="rp">
    <div class="rp-head">
      <div class="rp-brand"><span class="rp-mark"></span>FIREWISE — EQUIPMENT CARE</div>

    </div>
    <table class="rp-meta">
      <tr><th>Type</th><td>${esc(REPORT_TYPES[r.type]||'')}</td><th>Date</th><td>${fmtDate(r.date)}</td><th>Technicien</th><td>${esc(r.tech||'')}</td></tr>
      <tr><th>Objet</th><td colspan="5">${esc(reportObjet(r))}</td></tr>
    </table>
    ${tests.length ? sec('Matériel concerné & tests', `<table class="rp-pieces">
        <tr><th>Matériel</th><th style="width:90px">Résultat</th><th>Observation</th></tr>
        ${tests.map(t => `<tr><td>${esc(t.label)||'—'}</td>${resCell(t.res)}<td>${esc(t.note)||'—'}</td></tr>`).join('')}
      </table>`) : ''}
    ${(profile.sections.includes('reception')) ? sec('Réception d’installation', para(r.reception, 'Non renseignée.')) : ''}
    ${(profile.sections.includes('diagnostic')) ? sec('Diagnostic', para(r.diagnostic, 'Aucun défaut signalé.')) : ''}
    ${(profile.sections.includes('diagnostic') && r.diag2) ? sec('Analyse & origine', para(r.diag2)) : ''}
    ${(profile.sections.includes('reglages')) ? sec('Réglages & paramétrage', para(r.reglages, 'Non renseignés.')) : ''}
    ${(profile.sections.includes('controle')) ? sec('Contrôles & essais', para(r.obs, '—')) : ''}
    ${(profile.sections.includes('rondes')) ? sec('Rondes & contrôles visuels', para(r.obs, '—')) : ''}
    ${(profile.sections.includes('obs')) ? sec('Observations / constat', para(r.obs, '—')) : ''}
    ${sec('Anomalies constatées', para(r.anomalies, 'Aucune anomalie relevée.'))}
    ${sec('Actions réalisées', para(r.actions, '—'))}
    ${sec('Pièces remplacées',
      pieces.length ? `<table class="rp-pieces">
        <tr><th>Désignation</th><th>Référence</th><th style="width:60px">Qté</th></tr>
        ${pieces.map(p => `<tr><td>${esc(p.d)}</td><td>${esc(p.r||'—')}</td><td>${esc(p.q||'—')}</td></tr>`).join('')}
      </table>` : '<p class="rp-empty">Aucune pièce remplacée.</p>')}
    ${batteries.length ? sec('Mesures batteries', `<table class="rp-pieces">
        <tr><th>Matériel</th><th>Batterie</th><th>Mesures (I · U t0→1 h)</th><th>Autonomie / capacité</th><th>Résultat</th><th>Observation</th></tr>
        ${batteries.map(b => {
          const batTxt = [b.cnom ? b.cnom + ' Ah' : '', b.unom ? b.unom + ' V' : ''].filter(Boolean).join(' · ') || '—';
          const testTxt = [b.iabs ? 'I ' + b.iabs + ' A' : '', (b.ut0 || b.ut1) ? (b.ut0||'?') + ' → ' + (b.ut1||'?') + ' V' : ''].filter(Boolean).join(' · ') || '—';
          const capTxt = [b.aut ? b.aut + ' h' : '', b.areq ? '/ ' + b.areq + ' h requis' : '', b.cmes ? '· ' + b.cmes + ' % restant' : ''].filter(Boolean).join(' ') || '—';
          return `<tr><td>${esc(b.mat)||'—'}</td><td>${esc(batTxt)}</td><td>${esc(testTxt)}</td><td>${esc(capTxt)}</td>${resCell(b.res)}<td>${esc(b.note)||'—'}</td></tr>`;
        }).join('')}
      </table>`) : ''}
    ${(profile.sections.includes('formation')) ? sec('Formation & remise', para(r.formation, 'Aucune formation mentionnée.')) : ''}
    ${sec('Recommandations', para(r.reco, '—'))}
    ${sec('Prochaine visite', `<p>${r.nextVisit ? fmtDate(r.nextVisit) : '<span class="rp-empty">Non planifiée.</span>'}</p>`)}
    <div class="rp-sigs">
      <div class="rp-sig"><div class="cap">Signature du technicien</div>
