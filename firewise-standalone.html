<script>
/* ===== exports.js ===== */
/* =====================================================================
   FIREWISE EQUIPMENT CARE — exports.js
   Exports : PDF (html2pdf.js) et Word .docx (docx.js)
   Inclut : pièces, matériel testé, mesures batteries, signatures
===================================================================== */

/* ---------- 13. Exports (PDF / Word) ---------- */
function exportPDF(reportId){
  const r = state.reports.find(x => x.id === reportId);
  if(!r) return;
  if(typeof html2pdf === 'undefined'){ return toast('Bibliothèque PDF non chargée : vérifiez votre connexion réseau.'); }
  const pa = document.getElementById('printArea');
  pa.innerHTML = `<div class="rp-wrap" style="background:#fff;padding:26px 30px">${reportSheetHTML(r)}</div>`;
  html2pdf().set({
    margin:[8,8,8,8],
    filename:`${r.no}-${slug(REPORT_TYPES[r.type]||'rapport')}.pdf`,
    image:{ type:'jpeg', quality:0.96 },
    html2canvas:{ scale:2, useCORS:true, backgroundColor:'#ffffff' },
    jsPDF:{ unit:'mm', format:'a4', orientation:'portrait' },
    pagebreak:{ mode:['css','legacy'] },
  }).from(pa.firstChild).save()
    .then(() => { pa.innerHTML = ''; toast('PDF généré.', true); })
    .catch(() => { pa.innerHTML = ''; toast('Échec de la génération PDF.'); });
}

function b64ToU8(b64){
  const bin = atob(String(b64).split(',')[1] || '');
  const u = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return u;
}

function exportDOCX(reportId){
  const r = state.reports.find(x => x.id === reportId);
  if(!r) return;
  const D = window.docx;
  if(!D || !D.Document){ return toast('Bibliothèque Word non chargée : vérifiez votre connexion réseau.'); }

  const border = { style: D.BorderStyle.SINGLE, size: 4, color: '444444' };
  const cellBorders = { top:border, bottom:border, left:border, right:border };
  const cell = (text, opts = {}) => new D.TableCell({
    borders: cellBorders,
    margins: { top: 60, bottom: 60, left: 100, right: 100 },
    width: opts.w ? { size: opts.w, type: D.WidthType.PERCENTAGE } : undefined,
    shading: opts.head ? { fill: 'EFECEB' } : undefined,
    children: [new D.Paragraph({ children: [new D.TextRun({ text: text || '—', bold: !!opts.head, size: opts.head ? 19 : 20 })] })],
  });
  const sec = title => new D.Paragraph({
    spacing: { before: 220, after: 90 },
    border: { bottom: { style: D.BorderStyle.SINGLE, size: 4, color: '555555' } },
    children: [new D.TextRun({ text: title.toUpperCase(), bold: true, size: 19, color: '444444' })],
  });
  const para = (t, opts = {}) => new D.Paragraph({
    spacing: { after: 60 },
    children: [new D.TextRun({ text: t || '—', size: 20, italics: !!opts.i })],
  });
  const img = data => new D.Paragraph({
    children: [new D.ImageRun({ data: b64ToU8(data), transformation: { width: 220, height: 68 } })],
  });

  const pieces = (r.pieces || []);
  const tests = (r.tests || []);
  const batteries = (r.batteries || []);

  const piecesTable = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    rows: [
      new D.TableRow({ tableHeader: true, children: [cell('Désignation', { head:true }), cell('Référence', { head:true }), cell('Qté', { head:true, w:12 })] }),
      ...(pieces.length ? pieces.map(p => new D.TableRow({ children: [cell(p.d), cell(p.r), cell(p.q)] }))
        : [new D.TableRow({ children: [cell('Aucune pièce remplacée'), cell(''), cell('')] })]),
    ],
  });

  const testedTable = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    rows: [
      new D.TableRow({ tableHeader: true, children: [cell('Matériel', { head:true }), cell('Résultat', { head:true, w:18 }), cell('Observation', { head:true })] }),
      ...(tests.length ? tests.map(t => new D.TableRow({ children: [cell(t.label), cell(TEST_RESULTS[t.res]||'—'), cell(t.note)] }))
        : [new D.TableRow({ children: [cell('Aucun matériel concerné'), cell(''), cell('')] })]),
    ],
  });

    const batteriesTable = new D.Table({
    width: { size: 100, type: D.WidthType.PERCENTAGE },
    rows: [
      new D.TableRow({ tableHeader: true, children: [
        cell('Matériel', { head:true }), cell('Batteries', { head:true }),
        cell('Charge (U / I)', { head:true, w:12 }),
        cell('Test (I absorbée · U t0→t1h)', { head:true, w:16 }),
        cell('Capacité restante / autonomie', { head:true, w:16 }),
        cell('Résultat', { head:true, w:13 }),
        cell('Observation', { head:true }),
      ]}),
      ...(batteries.length ? batteries.map(b => {
        const chargeTxt = [b.vch ? b.vch + ' V' : '', b.ich ? b.ich + ' A' : ''].filter(Boolean).join(' / ') || '—';
        const batTxt = [b.bat, b.cnom ? b.cnom + ' Ah' : '', b.unom ? b.unom + ' V' : ''].filter(Boolean).join(' · ') || '—';
        const testTxt = [b.iabs ? 'I ' + b.iabs + ' A' : '', (b.ut0 || b.ut1) ? (b.ut0||'?') + ' → ' + (b.ut1||'?') + ' V' : ''].filter(Boolean).join(' · ') || '—';
        const capTxt = [b.cmes ? b.cmes + ' % restant' : '', b.aut ? b.aut + ' h autonomie' : '', b.q1h ? b.q1h + ' Ah consommés (1 h)' : ''].filter(Boolean).join(' · ') || '—';
        return new D.TableRow({ children: [
          cell(b.mat), cell(batTxt), cell(chargeTxt), cell(testTxt), cell(capTxt),
          cell(BATTERY_RESULTS[b.res]||'Non testé'), cell(b.note),
        ]});
      }) : [new D.TableRow({ children: [cell('Aucune mesure relevée'), cell(''), cell(''), cell(''), cell(''), cell(''), cell('')] })]),
    ],
  });

  const children = [
    new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing:{ after: 40 },
      children: [new D.TextRun({ text: "RAPPORT D'INTERVENTION SSI", bold: true, size: 34 })] }),
    new D.Paragraph({ alignment: D.AlignmentType.CENTER, spacing:{ after: 240 },
      children: [new D.TextRun({ text: `${r.no} — ${REPORT_TYPES[r.type]||''}`, bold: true, size: 22, color: 'C1272D' })] }),
    sec('Informations'),
    new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [
      new D.TableRow({ children: [cell('Date', { head:true, w:16 }), cell(fmtDate(r.date), { w:34 }), cell('Technicien', { head:true, w:16 }), cell(r.tech, { w:34 })] }),
      new D.TableRow({ children: [cell('Objet', { head:true, w:16 }), cell(reportObjet(r))] }),
    ]}),
    sec('Matériel concerné & tests'), testedTable,
    sec('Observations / constat'), para(r.obs),
    sec('Anomalies constatées'), para(r.anomalies || 'Aucune anomalie relevée.'),
    sec('Actions réalisées'), para(r.actions),
    sec('Pièces remplacées'), piecesTable,
    sec('Mesures batteries'), batteriesTable,
    sec('Recommandations'), para(r.reco),
    sec('Prochaine visite'), para(r.nextVisit ? fmtDate(r.nextVisit) : 'Non planifiée.'),
    sec('Signatures'),
    new D.Table({ width: { size: 100, type: D.WidthType.PERCENTAGE }, rows: [
      new D.TableRow({ children: [
        new D.TableCell({ borders: cellBorders, margins:{ top:60,bottom:60,left:100,right:100 },
          children: [new D.Paragraph({ children:[new D.TextRun({ text:'Technicien', bold:true, size:18, color:'555555' })] }),
                     ...(r.sigTech ? [img(r.sigTech)] : [para('Non signé', { i:true })])] }),
        new D.TableCell({ borders: cellBorders, margins:{ top:60,bottom:60,left:100,right:100 },
          children: [new D.Paragraph({ children:[new D.TextRun({ text:'Client / représentant', bold:true, size:18, color:'555555' })] }),
                     ...(r.sigClient ? [img(r.sigClient)] : [para('Non signé', { i:true })])] }),
      ]}),
    ]}),
    new D.Paragraph({ spacing:{ before: 200 }, children: [new D.TextRun({
      text: `Document généré le ${fmtDate(todayISO())} par Firewise Equipment Care — ${r.no}`,
      size: 16, color: '888888' })] }),
  ];

  try{
    const doc = new D.Document({ sections: [{ properties: {}, children }] });
    D.Packer.toBlob(doc).then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${r.no}-${slug(REPORT_TYPES[r.type]||'rapport')}.docx`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast('Document Word généré.', true);
    }).catch(() => toast('Échec de la génération Word.'));
  }catch(e){
    toast('Échec de la génération Word : ' + e.message);
  }
}

/* ===== FIN DE exports.js ===== */
</script>
<script>

/* ---------- 14. Vue : Réglages ---------- */
function renderSettings(v){
  v.innerHTML = `
    <div class="view-head"><div><h1>Réglages</h1><div class="sub">Données locales, sauvegardes et démonstration</div></div></div>
    <div class="dash-grid">
      <div style="display:flex;flex-direction:column;gap:20px">
        <div class="panel">
          <div class="panel-h"><h2>Sauvegarde & restauration</h2></div>
          <div class="panel-b" style="padding-top:14px">
            <p class="hint" style="margin-bottom:14px">Toutes les données (sites, matériel, catalogue marques/références, photos, rapports) sont stockées dans le navigateur, rien ne quitte cet appareil. Exportez régulièrement un fichier de sauvegarde.</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn" id="stExpJson">Exporter la sauvegarde (.json)</button>
              <button class="btn" id="stImpJson">Importer une sauvegarde</button>
              <button class="btn" id="stExpCsv">Exporter le registre (.csv)</button>
              <input type="file" id="stFile" accept="application/json" style="display:none">
            </div>
          </div>
        </div>
        <div class="panel">
          <div class="panel-h"><h2>Zone sensible</h2></div>
          <div class="panel-b" style="padding-top:14px">
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn" id="stDemo">Charger le jeu de démonstration</button>
              <button class="btn danger" id="stReset">Tout effacer</button>
            </div>
            <p class="hint" style="margin-top:12px">« Tout effacer » supprime définitivement sites, bâtiments, matériel, catalogue et rapports de cet appareil.</p>
          </div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-h"><h2>À propos</h2></div>
        <div class="panel-b" style="padding-top:14px;line-height:1.8;font-size:13px;color:var(--ink-2)">
          <p><b style="color:var(--ink)">Firewise Equipment Care — v1.1</b><br>
          Application autonome de gestion et de suivi du matériel SSI : registre hiérarchique, catalogue marques/références auto-alimenté, photos d’identification, rapports d’intervention signés, exports PDF et Word.</p>
          <p style="margin-top:10px">Bibliothèques via CDN (signature_pad, html2pdf.js, docx.js) · aucune donnée transmise à un serveur.</p>
          <p style="margin-top:10px">Astuce : sur Android, ouvrez cette application dans Chrome puis utilisez « Ajouter à l’écran d’accueil » pour l’utiliser comme une application.</p>
        </div>
      </div>
    </div>`;

  const download = (blob, name) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };

  v.querySelector('#stExpJson').onclick = () => {
    download(new Blob([JSON.stringify(state, null, 2)], { type:'application/json' }),
      `sauvegarde-firewise-${todayISO()}.json`);
    toast('Sauvegarde exportée.', true);
  };
  const fileInput = v.querySelector('#stFile');
  v.querySelector('#stImpJson').onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const f = fileInput.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const d = JSON.parse(rd.result);
        if(!d || !Array.isArray(d.sites) || !Array.isArray(d.equipment)) throw new Error('format');
        state = {
          sites:d.sites,
          buildings: Array.isArray(d.buildings) ? d.buildings : [],
          equipment:d.equipment,
          reports:Array.isArray(d.reports) ? d.reports : [],
          catalog:Array.isArray(d.catalog) ? d.catalog : [],
        };

      rows.push([s?s.name:'', b?b.name:'', typeLabel(e.type), e.brand||'', e.model||'', e.serial||'',
        e.loc||'', e.mes||'', STATUS[e.status]||'', e.photo ? 'oui' : 'non']);
    });
    const csv = '\uFEFF' + rows.map(rw => rw.map(c => `"${String(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    download(new Blob([csv], { type:'text/csv;charset=utf-8' }), `registre-ssi-${todayISO()}.csv`);
    toast('Registre exporté en CSV.', true);
  };
  v.querySelector('#stDemo').onclick = () => {
    confirmBox('Jeu de démonstration', 'Charger les données de démonstration SSI ? Elles remplaceront les données actuelles de cet appareil.', () => {
      state = { sites:[], buildings:[], equipment:[], reports:[], catalog:[] };
      seedDemo(); ui.siteId = null; ui.buildingId = null; ui.reportId = null;
      render(); toast('Jeu de démonstration chargé.', true);
    });
  };
  v.querySelector('#stReset').onclick = () => {
    confirmBox('Tout effacer', 'Cette action supprime <b>définitivement</b> toutes les données locales (y compris le catalogue et les photos). Continuer ?', () => {
      try{ localStorage.removeItem(LS_KEY); }catch(e){}
      state = { sites:[], buildings:[], equipment:[], reports:[], catalog:[] };
      ui.siteId = null; ui.buildingId = null; ui.reportId = null;
      render(); toast('Toutes les données ont été effacées.', true);
    });
  };
}

/* ---------- 15. Démarrage ---------- */
try{
  if(!load()) seedDemo();
  render();
}catch(e){
  const v = document.getElementById('view');
  const msg = String((e && e.message) || e)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  if(v) v.innerHTML = '<div class="empty" style="padding:60px 20px"><b>Erreur au démarrage</b>'
    + '<p style="color:#c1272d;font-family:monospace;font-size:12px;white-space:pre-wrap;text-align:left">' + msg + '</p>'
    + '<p>Rechargez la page. Si le problème persiste, ouvrez la console (F12) '
    + 'ou tapez <code>localStorage.clear()</code> dans la console puis rechargez.</p></div>';
  console.error('Firewise startup error:', e);
}

/* ===== FIN DE settings.js ===== */
</script>

      : '<p style="margin:12px 0">Aucun fichier .js n\'a pu être chargé — ouvrez index.html depuis son dossier complet.</p>';
    v.innerHTML = '<div style="padding:40px 24px;max-width:600px;margin:0 auto;font-family:system-ui,sans-serif">'
      + '<h2 style="color:#c1272d;margin:0 0 8px">L\'application n\'a pas pu démarrer</h2>'

      + '<p style="margin-top:14px;line-height:1.6;color:#666">Détail des erreurs dans la console : <b>F12</b> → onglet « Console ».</p>'

  }
});
